<script>
	$(document).ready(function(){

		var route = 'umk/rekam';
	
		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}
		
		function cariNourut(){
			$.get('dropdown/nourut/3', function(result){
				$('#nourut').val(result);
			});
		}
	
		$.fn.dataTable.ext.errMode = 'none';
		
		$('.uang').inputmask('numeric', {
			radixPoint: '.',
			groupSeparator: ',',
			autoGroup: true,
			prefix: '',
			rightAlign: false,
			digits: 2,
			oncleared: function () {
				// Fungsi ini akan dipanggil saat input dihapus
				$(this).val('');
			}
		});
		
		//aktivasi chosen
		$('.chosen').select2();
		
		$.get('dropdown/sdana', function(result){
			$('#kdsdana').html(result).trigger('change');
		});
		
		$.get('dropdown/proyek', function(result){
			$('#id_proyek').html(result).trigger('change');
		});
		
		$.get('dropdown/alur-umk', function(result){
			$('#id_alur').html(result).trigger('change');
		});
		
		$.get('dropdown/penerima', function(result){
			$('#id_pelanggan').html(result).trigger('change');
		});
		
		$.get('dropdown/transaksi', function(result){
			$('#kdtran').html(result).trigger('change');
		});
		
		$.get(route, function(result){
			if(result=='1'){ //admin
				$('#tambah').show();
			}
		});
		
		$('#id_alur').on('select2:select', function(){
			var id_alur = $(this).val();
			$.get('dropdown/transaksi/'+id_alur, function(result){
				$('#kdtran').html(result).trigger('change');
			});
		});
		
		$.get('dropdown/akun/debet/8', function(result){
			$('#debet').html(result).trigger('change');
		});
		
		$('#kdsdana,#id_proyek,#debet').on('select2:select', function(){
			
			var kdsdana = $('#kdsdana').val();
			var id_proyek = $('#id_proyek').val();
			var kdakun = $('#debet').val();
			
			if(kdsdana!=='' && id_proyek!=='' && kdakun!==''){
				
				$.getJSON('anggaran/pagu/unit/sisa?kdsdana='+kdsdana+'&id_proyek='+id_proyek+'&kdakun='+kdakun, function(result){
					if(result){
						$('#pagu').val(digit_grouping(result.pagu));
						$('#realisasi').val(digit_grouping(result.realisasi));
						$('#sisa').val(digit_grouping(result.sisa));
					}
					else{
						alertify.log('Pagu dan realisasi tidak ditemukan!');
						$('#pagu,#realisasi,#sisa').val(0);
					}
				});
				
			}
			
		});
		
		//tampilan default
		function form_default() {
			$('input,select,textarea').val('');
			$('.warning, #div-form, #cari-nourut').hide();
			$('#div-tabel').show();
			$('.chosen').prop('disabled', false).trigger('change');
			$('#simpan').prop('disabled', false);
			$('#tabel-rincian').html('');
			$.get('dropdown/ttd/05', function(result){
				$('#ttd1').html(result).trigger('change');
			});
			
			$.get('dropdown/ttd/04', function(result){
				$('#ttd2').html(result).trigger('change');
			});
			
			$.get('dropdown/ttd/02', function(result){
				$('#ttd3').html(result).trigger('change');
			});
			
			$.get('dropdown/ttd/01', function(result){
				$('#ttd4').html(result).trigger('change');
			});
		}
		
		//aktivasi tampilan default
		form_default();
		
		//klik tambah
		$('#tambah').click(function(){
			$('#div-tabel').hide();
			$('#inp-rekambaru').val('1');
			$('#div-form,#cari-nourut').show();
			$('#nilai,#ppn,#total').val(0);
			cariNourut();
		});
		
		// datatable init
        $("#exportPrint").on("click", function () {
            table.button('.buttons-print').trigger();
        });

		$("#exportPdf").on("click", function () {
            table.button('.buttons-pdf').trigger();
        });

		$("#exportExcel").on("click", function () {
            table.button('.buttons-excel').trigger();
        });

		//data tabel
		var table = $('#tabel-ruh').DataTable({
			buttons: [
                {
                    extend: 'print',
                    title: 'Rekam UMK',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
                {
                    extend: 'pdf',
                    title: 'Rekam UMK',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
				{
                    extend: 'excel',
					title: 'Rekam UMK',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
            ],
            lengthMenu: [
                [10, 25, 50, 100, -1],
                [10, 25, 50, 100, "Semua"],
            ],
			processing: true,
			language:{
			    "decimal":        "",
			    "emptyTable":     "Tidak ada data tersedia",
			    "info":           "Menampilkan _START_ sampai _END_ dari _TOTAL_ entri",
			    "infoEmpty":      "Menampilkan 0 sampai 0 dari 0 entri",
			    "infoFiltered":   "(disaring dari _MAX_ total entri)",
			    "infoPostFix":    "",
			    "thousands":      ",",
			    "lengthMenu":     "Tampilkan _MENU_ entri",
			    "loadingRecords": "Proses Loading...",
			    "processing":     "Sedang Proses...",
			    "search":         "Cari:",
			    "zeroRecords":    "Tidak ditemukan data yang sesuai",
			    "paginate": {
			        "first":      "Awal",
			        "last":       "Akhir",
			        "next":       "Sesudah",
			        "previous":   "Sebelum"
			    },
			    "aria": {
			        "sortAscending":  ": aktifkan untuk mengurutkan kolom (asc)",
			        "sortDescending": ": aktifkan untuk mengurutkan kolom (desc)"
			    }
			},
			serverSide: true,
			ajax: {
				url: route + "/data",
			},
			columns: [
				{ data: "DT_RowIndex", name: "DT_RowIndex", className: "t-center", orderable: false, searchable: false },
				{ data: "nourut", name: "nourut", className: "t-left" },
				{ data: "nmunit", name: "nmunit", className: "t-left" },
				{ data: "nmtrans", name: "nmtrans", className: "t-left" },
				{ data: "nilai", name: "nilai", className: "t-right" },
				{ data: "status", name: "status", className: "t-left" },
				{ data: "aksi", name: "aksi", className: "t-center", orderable: false, searchable: false },
			],
		});
		
		//validasi isian form
		function form_valid(str_id){
			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if($('#'+arr_id[x]).val()==''){
					$('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
		
		//cari data user yang akan di edit berdasarkan id user
		function cari_data(id){
			$('.chosen').val('');
			$.getJSON(route+'/pilih/'+id, function(result){
				if(result.error==false) {
				
					$.get('dropdown/transaksi/'+result.message.id_alur, function(result1){
						$('#kdtran').html(result1).trigger('change');
						$('#kdtran').val(result.message.kdtran).trigger('change');
					});
					
					$('#debet').val(result.message.debet).trigger('change');
					$('#kdsdana').val(result.message.kdsdana).trigger('change');
					$('#id_proyek').val(result.message.id_proyek).trigger('change');
					$('#kredit').html(result.dropdown_k).trigger('change');
					$('#ttd1').val(result.message.ttd1);
					$('#ttd2').val(result.message.ttd2);
					$('#ttd3').val(result.message.ttd3);
					$('#ttd4').val(result.message.ttd4);
					$('#inp-id').val(id);
					$('#inp-rekambaru').val('0');
					$('#nourut').val(result.message.nourut);
					$('#kdunit').val(result.message.kdunit);
					$('#id_alur').val(result.message.id_alur);
					$('#id_pelanggan').val(result.message.id_pelanggan);
					$('#nopks').val(result.message.nopks);
					$('#tgpks').val(result.message.tgpks);
					$('#tgjtempo').val(result.message.tgjtempo);
					$('#uraian').val(result.message.uraian);
					$('#nilai').val(digit_grouping(result.message.nilai));
					$('.chosen').trigger('change');
				}
				else{
					alertify.log(result.message);
				}
			});
		}
		
		//klik ubah
		$('body').off('click', '.ubah').on('click', '.ubah', function(){
			var id = this.id;
			$('#div-tabel').hide();
			$('#div-form').show();
			cari_data(id);
		});
		
		//klik batal
		$('.batal').click(function(){
			form_default();
		});
		
		//klik refresh nomor transaksi
		$('#cari-nourut').click(function(){
			cariNourut();
		});
		
		//klik simpan
		$('#simpan').click(function(){
			$(this).html('<span class="loading"><i class="fa fa-refresh"></i> Loading.....</span>');
			$(this).prop('disabled',true);
			var next = form_valid('nourut,id_alur,id_pelanggan,kdtran,nopks,tgpks,uraian,tgjtempo,nilai');
			if(next==true){
				$.get('token', function(token){
					if(token){
						$('#_token').val(token);
						var data = $('#form-ruh').serialize();
						$.ajax({
							url: route,
							method: 'POST',
							data: data,
							success: function(result){
								if(result=='success') {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log('Proses simpan berhasil');
									form_default();
									table.ajax.reload();
								} else {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log(result);
								} 
							},
							error: function(result){
								$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								$('#simpan').prop('disabled',false);
								alertify.log('Data tidak dapat disimpan. Koneksi pada aplikasi/database terputus atau data sudah pernah direkam atau format data salah. Hubungi Administrator.');
							}
						})
					}
					else{
						$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						$('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
			}
			else{
				$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
				$('#simpan').prop('disabled',false);
				alertify.log('Data tidak dapat dikosongkan!');
			}
		});
		
		//hapus
		$('body').off('click', '.hapus').on('click', '.hapus', function(){
			var id = this.id;
			alertify.confirm('Hapus data ini?', function(c){
				if(c) {
					$.get('token', function(token){
						if(token) {
							$.ajax({
								url:route+'/hapus',
								method:'POST',
								data:{
									_token:token, 
									id:id
								},
								success:function(result){
									if(result=='success') {
										alertify.log('Proses hapus berhasil.');
										table.ajax.reload();
									} else {
										alertify.log(result);
									}
								},
								error:function(result){
									alertify.log('Koneksi pada aplikasi/database terputus. Hubungi Administrator.');
								}
							});
						} else {
							alertify.log('Proses hapus gagal. Silahkan refresh halaman browser anda.');
						} 
					});
				} 
			});
		});
		
	});
	
</script>
