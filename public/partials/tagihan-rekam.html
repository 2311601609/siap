<script>
	$(document).ready(function(){

		var route = 'tagihan/rekam';
		
		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}
		
		function cariNourut(){
			$.get('dropdown/nourut/1', function(result){
				$('#nourut').val(result);
			});
			$.get('dropdown/tanggal', function(result){
				$('#tgrekam').val(result);
			});
		}
	
		$.fn.dataTable.ext.errMode = 'none';
		
		$('.uang').inputmask('numeric', {
			radixPoint: '.',
			groupSeparator: ',',
			autoGroup: true,
			prefix: '',
			rightAlign: false,
			digits: 2,
			oncleared: function () {
				// Fungsi ini akan dipanggil saat input dihapus
				$(this).val('');
			}
		});
		
		//aktivasi chosen
		$('.chosen').select2();
		
		$('.ui-layout-toggler-north').click(function(){
			$('#chosen_select').toggleClass('hide');
		});
		
		$.get('dropdown/unit?param=4', function(result){
			$('#kdunit').html(result).trigger('change');
		});

		$.get('dropdown/sdana', function(result){
			$('#kdsdana').html(result).trigger('change');
		});

		$('body').off('select2:select', '#kdunit').on('select2:select', '#kdunit', function(){
			if($(this).val()){
				var kdunit = $(this).val();
				$('#id_kontrak').html('<option value="">Sedang proses...</option>').trigger('change');
				$.get('dropdown/kontrak?tipe=1&kdunit='+kdunit, function(result){
					$('#id_kontrak').html(result).trigger('change');
					$('#id_kontrak_dtl').html('').trigger('change');
				});
			}
		});

		$('body').off('select2:select', '#id_kontrak').on('select2:select', '#id_kontrak', function(){
			if($(this).val()){
				var id_kontrak = $(this).val();
				$('#id_kontrak_dtl').html('<option value="">Sedang proses...</option>').trigger('change');
				$.get('dropdown/kontrak-dtl?id_kontrak='+id_kontrak+'&update=0', function(result){
					$('#id_kontrak_dtl').html(result).trigger('change');
				});
			}
		});

		$('body').off('select2:select', '#id_kontrak_dtl').on('select2:select', '#id_kontrak_dtl', function(){
			if($(this).val()){
				var id_kontrak_dtl = $(this).val();
				$.getJSON('dropdown/kontrak-dtl-info?id='+id_kontrak_dtl, function(result){
					
					$('#nopks').val(result.nodok);
					$('#tgpks').val(result.tgdok);
					$('#nmpenerima').val(result.nama);
					$('#uraian_kontrak').val(result.ket);
					$('#nilai_kontrak').val(result.nilai_kontrak);
					$('#nilai').val(result.nilai);
					$('#tgjtempo').val(result.tgjtempo);
					$('#id_alur').val(result.id_alur);
					$('#id_proyek').val(result.id_proyek);
					$('#id_pelanggan').val(result.id_pelanggan);
					$('#kdtran').val(result.kdtran);

				});
			}
		});
		
		$.get('dropdown/akun/debet/1', function(result){
			$('#debet').html(result).trigger('change');
		});

		$.get('dropdown/akun/kredit/1', function(result){
			$('#kredit').html(result).trigger('change');
		});

		$.getJSON('dropdown/akun-pajak-baru/json?id_trans=1', function(result){
			var akun='<option value="" style="display:none;">Pilih Akun</option>';
			$.each(result, function(i,field){
				akun+='<option value="'+field.kdakun+'|'+field.kddk+'|'+field.nilai+'">'+field.kdakun+' - '+field.nmakun+' ('+field.kddk+')</option>';
			});
			$('#inp-akun').val(akun);
		});

		$.get('dropdown/ttd/05', function(result){
			$('#ttd1').html(result).trigger('change');
		});
		
		$.get('dropdown/ttd/04', function(result){
			$('#ttd2').html(result).trigger('change');
		});
		
		$.get('dropdown/ttd/02', function(result){
			$('#ttd3').html(result).trigger('change');
		});
		
		$.get('dropdown/ttd/01', function(result){
			$('#ttd4').html(result).trigger('change');
		});

		$.get(route, function(result){
			if(result=='1'){ //admin
				$('#tambah').show();
			}
		});
		
		//tampilan default
		function form_default() {
			$('#nourut,#kdsdana,#kdunit,#id_alur,#id_pelanggan,#kdtran,#nopks,#tgpks,#nmpenerima,#uraian_kontrak,#nilai_kontrak,#uraian,#tgjtempo,#nilai,#debet,#kredit,#id_kontrak,#id_kontrak_dtl').val('');
			$('#kdsdana,#kdunit,#id_kontrak,#id_kontrak_dtl').prop('disabled', false);
			$('#kdsdana,#kdunit,#id_kontrak,#id_kontrak_dtl,#debet,#kredit').trigger('change');
			$('#nilai_des').val('00');
			$('.warning, #div-form, #cari-nourut').hide();
			$('#div-tabel').show();
			$('#simpan').prop('disabled', false);
			$('#tabel-rincian').html('');
		}
		
		//aktivasi tampilan default
		form_default();
		
		//klik tambah
		$('#tambah').click(function(){
			$('#div-tabel').hide();
			$('#inp-rekambaru').val('1');
			$('#div-form,#cari-nourut').show();
			$('#nilai,#ppn,#total').val(0);
			cariNourut();
			$('#x').val(0);
			
			$('#tabel-rincian').html(
				'<tr id="tr-0">'+
					'<td>'+
						'<select id="chosen-0" class="form-control akun" name="rincian[0][\'kdakun\']" style="z-index:999999999 !important;">'+
							$('#inp-akun').val()+
						'</select>'+
					'</td>'+
					'<td><input id="nilai-0" style="text-align:right;" type="text" name="rincian[0][\'nilai\']" value="0"></td>'+
					'<td>'+
						'<center><a href="javascript:;" id="0" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
					'</td>'+
				'</tr>'
			);
			$('#chosen-0').select2({width:'100%', search_contains: true });

			$('#nilai-0').inputmask('numeric', {
				radixPoint: '.',
				groupSeparator: ',',
				autoGroup: true,
				prefix: '',
				rightAlign: false,
				digits: 2,
				oncleared: function () {
					// Fungsi ini akan dipanggil saat input dihapus
					$(this).val('');
				}
			});

		});
		
		$('#tambah-detil').click(function(){
			var x=parseInt($('#x').val())+1;
			$('#tabel-rincian').append(
				'<tr id="tr-'+x+'">'+
					'<td>'+
						'<select id="chosen-'+x+'" class="form-control akun" name="rincian['+x+'][\'kdakun\']" style="z-index:999999999 !important;">'+
							$('#inp-akun').val()+
						'</select>'+
					'</td>'+
					'<td><input id="nilai-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="uang" value="0"></td>'+
					'<td>'+
						'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
					'</td>'+
				'</tr>'
			);
			$('#chosen-'+x).select2({width:'100%', search_contains: true});
			$('#x').val(x);
			$('#nilai-'+x).inputmask('numeric', {
				radixPoint: '.',
				groupSeparator: ',',
				autoGroup: true,
				prefix: '',
				rightAlign: false,
				digits: 2,
				oncleared: function () {
					// Fungsi ini akan dipanggil saat input dihapus
					$(this).val('');
				}
			});
		});
		
		$('body').off('click', '.hapus-detil').on('click', '.hapus-detil', function(){
			var id=this.id;
			$('#tr-'+id).remove();
		});

		// datatable init
        $("#exportPrint").on("click", function () {
            table.button('.buttons-print').trigger();
        });

		$("#exportPdf").on("click", function () {
            table.button('.buttons-pdf').trigger();
        });

		$("#exportExcel").on("click", function () {
            table.button('.buttons-excel').trigger();
        });

		//data tabel
		var table = $('#tabel-ruh').DataTable({
			buttons: [
                {
                    extend: 'print',
                    title: 'Rekam Tagihan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
                {
                    extend: 'pdf',
                    title: 'Rekam Tagihan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6 ]

                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
				{
                    extend: 'excel',
					title: 'Rekam Tagihan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6 ]

                    orientation: 'landscape',

			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if($('#'+arr_id[x]).val()==''){
					$('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
		
		//cari data user yang akan di edit berdasarkan id user
		function cari_data(id){
			$('.chosen').val('').trigger('change');
			$.getJSON(route + '/pilih/'+id, function(result){
				if(result.error==false) {
					
					$('#tabel-rincian').html('');
					$.each(result.akun, function(x,row){

						$('#tabel-rincian').append(
							'<tr id="tr-'+x+'">'+
								'<td>'+
									'<select id="chosen-'+x+'" class="form-control akun" name="rincian['+x+'][\'kdakun\']" style="z-index:999999999 !important;">'+
										$('#inp-akun').val()+
									'</select>'+
								'</td>'+
								'<td><input id="nilai-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="uang" value="'+row.nilai+'"></td>'+
								'<td>'+
									'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
								'</td>'+
							'</tr>'
						);
						$('#chosen-'+x).select2({width:'100%', search_contains: true});
						$('#chosen-'+x).val(row.kdakun+'|'+row.kddk+'|'+row.nilai1).trigger('change');

						$('#nilai-'+x).inputmask('numeric', {
							radixPoint: '.',
							groupSeparator: ',',
							autoGroup: true,
							prefix: '',
							rightAlign: false,
							digits: 2,
							oncleared: function () {
								// Fungsi ini akan dipanggil saat input dihapus
								$(this).val('');
							}
						});

					});

					$('#id_kontrak').html('<option value="">Sedang proses...</option>').trigger('change');
					$.get('dropdown/kontrak?kdunit='+result.message.kdunit, function(result1){
						$('#id_kontrak').html(result1).trigger('change');
						$('#id_kontrak').val(result.message.id_kontrak).trigger('change');
					});

					$('#id_kontrak_dtl').html('<option value="">Sedang proses...</option>').trigger('change');
					$.get('dropdown/kontrak-dtl?id_kontrak='+result.message.id_kontrak+'&update=1', function(result1){
						$('#id_kontrak_dtl').html(result1).trigger('change');
						$('#id_kontrak_dtl').val(result.message.id_kontrak_dtl).trigger('change');
					});

					$.getJSON('dropdown/kontrak-dtl-info?id='+result.message.id_kontrak_dtl, function(result){
					
						$('#nopks').val(result.nodok);
						$('#tgpks').val(result.tgdok);
						$('#nmpenerima').val(result.nama);
						$('#uraian_kontrak').val(result.ket);
						$('#nilai_kontrak').val(result.nilai_kontrak);
						$('#tgjtempo').val(result.tgjtempo);
						$('#id_alur').val(result.id_alur);
						$('#id_proyek').val(result.id_proyek);
						$('#id_pelanggan').val(result.id_pelanggan);
						$('#kdtran').val(result.kdtran);

					});
					
					$('#kdsdana').val(result.message.kdsdana).trigger('change');
					$('#debet').html(result.dropdown_d).trigger('change');
					$('#kredit').html(result.dropdown_k).trigger('change');
					$('#ttd1').val(result.message.ttd1).trigger('change');
					$('#ttd2').val(result.message.ttd2).trigger('change');
					$('#ttd3').val(result.message.ttd3).trigger('change');
					$('#ttd4').val(result.message.ttd4).trigger('change');
					$('#inp-id').val(id);
					$('#inp-rekambaru').val('0');
					$('#x').val(result.x);
					$('#nourut').val(result.message.nourut);
					$('#kdunit').val(result.message.kdunit).trigger('change');
					$('#tgrekam').val(result.message.tgrekam)
					$('#uraian').val(result.message.uraian);
					$('#nilai').val(result.message.nilai);
					$('#total').val(result.message.total);
					$('#kdsdana,#kdunit,#id_kontrak,#id_kontrak_dtl').prop('disabled', true).trigger('change');

				}
				else{
					alertify.log(result.message);
				}
			});
		}

		//klik simpan
		$('#simpan').click(function(){
			$(this).html('<span class="loading"><i class="fa fa-refresh"></i> Loading.....</span>');
			$(this).prop('disabled',true);
			var next = form_valid('nourut,kdsdana,kdunit,id_alur,id_pelanggan,kdtran,nopks,tgpks,uraian,tgjtempo,nilai,debet,kredit,id_kontrak_dtl');
			if(next==true){
				$.get('token', function(token){
					if(token){
						$('#_token').val(token);
						var data = $('#form-ruh').serialize();
						$.ajax({
							url: route,
							method: 'POST',
							data: data,
							success: function(result){
								if(result=='success') {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log('Proses simpan berhasil');
									form_default();
									table.ajax.reload();
								} else {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log(result);
								} 
							},
							error: function(result){
								$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								$('#simpan').prop('disabled',false);
								alertify.log('Data tidak dapat disimpan. Koneksi pada aplikasi/database terputus atau data sudah pernah direkam atau format data salah. Hubungi Administrator.');
							}
						})
					}
					else{
						$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						$('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
			}
			else{
				$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
				$('#simpan').prop('disabled',false);
				alertify.log('Data tidak dapat dikosongkan!');
			}
		});

							});
						} else {
							alertify.log('Proses hapus gagal. Silahkan refresh halaman browser anda.');

				} 
			});
		});
