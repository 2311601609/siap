<script>
	jQuery(document).ready(function(){
		
		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}
		
		function cariNourut(){
			jQuery.get('dropdown/nourut/1', function(result){
				jQuery('#nourut').val(result);
			});
			jQuery.get('dropdown/tanggal', function(result){
				jQuery('#tgrekam').val(result);
			});
		}
	
		jQuery.fn.dataTable.ext.errMode = 'none';
		
		jQuery('.val_num').mask('000,000,000,000,000', {reverse: true});
		
		//aktivasi chosen
		jQuery('.chosen').select2();
		
		$('.ui-layout-toggler-north').click(function(){
			$('#chosen_select').toggleClass('hide');
		});
		
		jQuery.get('dropdown/sdana', function(result){
			jQuery('#kdsdana').html(result).trigger('change');
		});
		
		jQuery.get('dropdown/unit/4', function(result){
			jQuery('#kdunit').html(result).trigger('change');
		});
		
		jQuery.get('dropdown/alur-tagihan', function(result){
			jQuery('#id_alur').html(result).trigger('change');
		});
		
		jQuery.get('dropdown/proyek', function(result){
			jQuery('#id_proyek').html(result).trigger('change');
		});
		
		jQuery.get('dropdown/penerima', function(result){
			jQuery('#id_pelanggan').html(result).trigger('change');
		});
		
		jQuery.get('dropdown/transaksi', function(result){
			jQuery('#kdtran').html(result).trigger('change');
		});
		
		jQuery.get('cek/level', function(result){
			if(result=='12'){ //admin
				jQuery('#tambah').show();
			}
		});
		
		jQuery('#id_alur').on('select2:select', function (e) {
			if(jQuery(this).val()){
				var id_alur = jQuery(this).val();
				jQuery.get('dropdown/transaksi/'+id_alur, function(result){
					jQuery('#kdtran').html(result).trigger('change');
				});
			}
		});
		
		jQuery('#id_proyek').on('select2:select', function (e) {
			if(jQuery(this).val()){
				var arr_id = jQuery(this).val().split('-');
				jQuery('#id_pelanggan').val(arr_id[1]).trigger('change');
			}
		});
		
		jQuery('#kdtran').on('select2:select', function (e) {
			if(jQuery(this).val()){
				var kdtran = jQuery(this).val();
				jQuery.get('dropdown/akun/debet/'+kdtran, function(result){
					jQuery('#debet').html(result).trigger('change');
				});
				jQuery.get('dropdown/akun/kredit/'+kdtran, function(result){
					jQuery('#kredit').html(result).trigger('change');
				});
			}
		});
		
		//tampilan default
		function form_default() {
			jQuery('input,select,textarea').val('');
			jQuery('#nilai_des').val('00');
			jQuery('.warning, #div-form, #cari-nourut').hide();
			jQuery('#div-tabel').show();
			jQuery('.chosen').prop('disabled', false).trigger('change');
			jQuery('#simpan').prop('disabled', false);
			jQuery('#tabel-rincian').html('');
			jQuery.getJSON('dropdown/akun-pajak/json', function(result){
				var akun='<option value="" style="display:none;">Pilih Akun</option>';
				jQuery.each(result, function(i,field){
					akun+='<option value="'+field.kdakun+'|'+field.kddk+'|'+field.nilai+'">'+field.kdakun+' - '+field.nmakun+'</option>';
				});
				jQuery('#inp-akun').val(akun);
			});
			jQuery.get('dropdown/ttd/05', function(result){
				jQuery('#ttd1').html(result).trigger('change');
			});
			
			jQuery.get('dropdown/ttd/04', function(result){
				jQuery('#ttd2').html(result).trigger('change');
			});
			
			jQuery.get('dropdown/ttd/02', function(result){
				jQuery('#ttd3').html(result).trigger('change');
			});
			
			jQuery.get('dropdown/ttd/01', function(result){
				jQuery('#ttd4').html(result).trigger('change');
			});
		}
		
		//aktivasi tampilan default
		form_default();
		
		//klik tambah
		jQuery('#tambah').click(function(){
			jQuery('#div-tabel').hide();
			jQuery('#inp-rekambaru').val('1');
			jQuery('#div-form,#cari-nourut').show();
			jQuery('#nilai,#ppn,#total').val(0);
			cariNourut();
			jQuery('#x').val(0);
			
			jQuery('#tabel-rincian').html(
				'<tr id="tr-0">'+
					'<td>'+
						'<select id="chosen-0" class="form-control akun" name="rincian[0][\'kdakun\']" style="z-index:999999999 !important;">'+
							jQuery('#inp-akun').val()+
						'</select>'+
					'</td>'+
					'<td><input id="nilai-0" style="text-align:right;" type="text" name="rincian[0][\'nilai\']" class="val_num" value="0"></td>'+
					'<td><input id="nilai_des-0" style="text-align:right;" type="text" name="rincian[0][\'nilai_des\']" class="val_num" maxlength="2" value="00"></td>'+
					'<td>'+
						'<center><a href="javascript:;" id="0" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
					'</td>'+
				'</tr>'
			);
			jQuery('.val_num').mask('000,000,000,000,000', {reverse: true});
			jQuery('#chosen-0').select2({width:'100%', search_contains: true });
		});
		
		jQuery('#tambah-detil').click(function(){
			var x=parseInt(jQuery('#x').val())+1;
			jQuery('#tabel-rincian').append(
				'<tr id="tr-'+x+'">'+
					'<td>'+
						'<select id="chosen-'+x+'" class="form-control akun" name="rincian['+x+'][\'kdakun\']" style="z-index:999999999 !important;">'+
							jQuery('#inp-akun').val()+
						'</select>'+
					'</td>'+
					'<td><input id="nilai-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="val_num" value="0"></td>'+
					'<td><input id="nilai_des-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai_des\']" class="val_num" maxlength="2" value="00"></td>'+
					'<td>'+
						'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
					'</td>'+
				'</tr>'
			);
			jQuery('#chosen-'+x).select2({width:'100%', search_contains: true});
			jQuery('.val_num').mask('000,000,000,000,000', {reverse: true});
			jQuery('#x').val(x);
		});
		
		jQuery('body').off('click', '.hapus-detil').on('click', '.hapus-detil', function(){
			var id=this.id;
			jQuery('#tr-'+id).remove();
		});
		
		//data tabel
		var table=jQuery('#tabel-ruh').DataTable({
			bProcessing:true,
			language:{
			    "decimal":        "",
			    "emptyTable":     "Tidak ada data tersedia",
			    "info":           "Menampilkan _START_ sampai _END_ dari _TOTAL_ entri",
			    "infoEmpty":      "Menampilkan 0 sampai 0 dari 0 entri",
			    "infoFiltered":   "(disaring dari _MAX_ total entri)",
			    "infoPostFix":    "",
			    "thousands":      ",",
			    "lengthMenu":     "Tampilkan _MENU_ entri",
			    "loadingRecords": "Proses Loading...",
			    "processing":     "Sedang Proses...",
			    "search":         "Cari:",
			    "zeroRecords":    "Tidak ditemukan data yang sesuai",
			    "paginate": {
			        "first":      "Awal",
			        "last":       "Akhir",
			        "next":       "Sesudah",
			        "previous":   "Sebelum"
			    },
			    "aria": {
			        "sortAscending":  ": aktifkan untuk mengurutkan kolom (asc)",
			        "sortDescending": ": aktifkan untuk mengurutkan kolom (desc)"
			    }
			},
			aaSorting: [],
			bServerSide: true,
			sAjaxSource: "tagihan/rekam"
		});
		
		//validasi isian form
		function form_valid(str_id){
			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if(jQuery('#'+arr_id[x]).val()==''){
					jQuery('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
		
		//cari data user yang akan di edit berdasarkan id user
		function cari_data(id){
			jQuery('.chosen').val('').trigger('change');
			jQuery.getJSON('tagihan/rekam/pilih/'+id, function(result){
				if(result.error==false) {
				
					jQuery.get('dropdown/transaksi/'+result.message.id_alur, function(result1){
						jQuery('#kdtran').html(result1);
						jQuery('#kdtran').val(result.message.kdtran).prop('disabled', true).trigger('change');
					});
					
					jQuery('#tabel-rincian').html('');
					jQuery.each(result.akun, function(x,row){
						jQuery('#tabel-rincian').append(
							'<tr id="tr-'+x+'">'+
								'<td>'+
									'<select id="chosen-'+x+'" class="form-control akun" name="rincian['+x+'][\'kdakun\']" style="z-index:999999999 !important;">'+
										jQuery('#inp-akun').val()+
									'</select>'+
								'</td>'+
								'<td><input id="nilai-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="val_num" value="'+digit_grouping(row.nilai)+'"></td>'+
								'<td><input id="nilai_des-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai_des\']" class="val_num" value="'+digit_grouping(row.nilai_des)+'" maxlength="2"></td>'+
								'<td>'+
									'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
								'</td>'+
							'</tr>'
						);
						jQuery('#chosen-'+x).val(row.kdakun+'|'+row.kddk+'|'+row.nilai1);
						jQuery('#chosen-'+x).select2({width:'100%', search_contains: true});
						jQuery('.val_num').mask('000,000,000,000,000', {reverse: true});
					});
					
					jQuery('#debet').html(result.dropdown_d).trigger('change');
					jQuery('#kredit').html(result.dropdown_k).trigger('change');
					jQuery('#ttd1').val(result.message.ttd1).trigger('change');
					jQuery('#ttd2').val(result.message.ttd2).trigger('change');
					jQuery('#ttd3').val(result.message.ttd3).trigger('change');
					jQuery('#ttd4').val(result.message.ttd4).trigger('change');
					jQuery('#inp-id').val(id);
					jQuery('#inp-rekambaru').val('0');
					jQuery('#x').val(result.x);
					jQuery('#nourut').val(result.message.nourut);
					jQuery('#kdsdana').val(result.message.kdsdana).trigger('change');
					jQuery('#kdunit').val(result.message.kdunit).trigger('change');
					jQuery('#id_alur').val(result.message.id_alur).prop('disabled',true).trigger('change');
					jQuery('#id_proyek').val(result.message.id_proyek).trigger('change');
					jQuery('#id_pelanggan').val(result.message.id_pelanggan).trigger('change');
					jQuery('#nopks').val(result.message.nopks);
					jQuery('#tgpks').val(result.message.tgpks);
					jQuery('#tgrekam').val(result.message.tgrekam);
					jQuery('#tgjtempo').val(result.message.tgjtempo);
					jQuery('#uraian').val(result.message.uraian);
					jQuery('#nilai').val(digit_grouping(result.message.nilai));
					jQuery('#nilai_des').val(result.message.nilai_des);
					jQuery('#total').val(digit_grouping(result.message.total));

				}
				else{
					alertify.log(result.message);
				}
			});
		}
		
		//klik ubah
		jQuery('body').off('click', '.ubah').on('click', '.ubah', function(){
			var id = this.id;
			jQuery('#div-tabel').hide();
			jQuery('#div-form').show();
			cari_data(id);

		//klik batal
		jQuery('.batal').click(function(){

		jQuery('#cari-nourut').click(function(){

		//klik simpan
		jQuery('#simpan').click(function(){
			jQuery(this).html('<span class="loading"><i class="fa fa-refresh"></i> Loading.....</span>');
			jQuery(this).prop('disabled',true);
			var next = form_valid('nourut,kdsdana,kdunit,id_alur,id_pelanggan,kdtran,nopks,tgpks,uraian,tgjtempo,nilai,debet,kredit');
			if(next==true){
				jQuery.get('token', function(token){
					if(token){
						jQuery('#_token').val(token);
						var data = jQuery('#form-ruh').serialize();
						jQuery.ajax({
							url: 'tagihan/rekam',
							method: 'POST',
							data: data,
							success: function(result){
								if(result=='success') {
									jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									jQuery('#simpan').prop('disabled',false);
									alertify.log('Proses simpan berhasil');
									form_default();
									table.ajax.reload();
								} else {
									jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									jQuery('#simpan').prop('disabled',false);
									alertify.log(result);
								} 
							},
							error: function(result){
								jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								jQuery('#simpan').prop('disabled',false);
								alertify.log('Data tidak dapat disimpan. Koneksi pada aplikasi/database terputus atau data sudah pernah direkam atau format data salah. Hubungi Administrator.');
							}
						})
					}
					else{
						jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						jQuery('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
			}
			else{
				jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
				jQuery('#simpan').prop('disabled',false);
				alertify.log('Data tidak dapat dikosongkan!');
			}
		});
		
		//hapus
		jQuery('body').off('click', '.hapus').on('click', '.hapus', function(){
			var id = this.id;
			alertify.confirm('Hapus data ini?', function(c){
				if(c) {
					jQuery.get('token', function(token){
						if(token) {
							jQuery.ajax({
								url:'tagihan/rekam/hapus',
								method:'POST',
								data:{
									_token:token, 
									id:id
								},
								success:function(result){
									if(result=='success') {
										alertify.log('Proses hapus berhasil.');
										table.ajax.reload();
									} else {
										alertify.log(result);
									}
								},
								error:function(result){
									alertify.log('Koneksi pada aplikasi/database terputus. Hubungi Administrator.');
								}
							});
						} else {
							alertify.log('Proses hapus gagal. Silahkan refresh halaman browser anda.');
						} 
					});
				} 
			});
		});
