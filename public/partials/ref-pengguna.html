		document.location.href='index.php';

<section>
	
	<div class="row">
        <div class="col-sm-12">
            <div class="content-header">Referensi/ Pengguna</div>
        </div>
    </div>
	
	<div class="row" id="div-form">
	    <div class="col-md-12">
	        <div class="card">
	            <div class="card-header">
	                <h4 class="card-title" id="horz-layout-basic">Form</h4>
	            </div>
	            <div class="card-body">
	                <div class="px-3">
	                    <form id="form-ruh" class="form form-horizontal">
	                    	<input type="hidden" id="inp-rekambaru" name="inp-rekambaru">
							<input type="hidden" id="inp-id" name="inp-id">
							<input type="hidden" id="_token" name="_token">

							<div class="row">
								<div class="col-md-6">
									<fieldset class="form-group">
										<label for="username">Username</label>
										<input type="text" id="username" name="username" class="form-control" maxlength="50">
									</fieldset>
									<fieldset class="form-group">
										<label for="nik">NIK</label>
										<input type="text" id="nik" name="nik" class="form-control val_num" maxlength="16">
									</fieldset>
									<fieldset class="form-group">
										<label for="nama">Nama</label>
										<input type="text" id="nama" name="nama" class="form-control" maxlength="255">
									</fieldset>
									<fieldset class="form-group">
										<label for="email">Email</label>
										<input type="text" id="email" name="email" class="form-control" maxlength="255">
									</fieldset>
								</div>
								<div class="col-md-6">
									<fieldset class="form-group">
										<label for="kdlevel">Kewenangan</label>
										<select id="kdlevel" name="kdlevel[]" class="form-control chosen" multiple>
										</select>
									</fieldset>
									<fieldset class="form-group">
										<label for="kdunit">Unit/ Divisi</label>
										<select id="kdunit" name="kdunit[]" class="form-control chosen" multiple>
										</select>
									</fieldset>
									<fieldset class="form-group">
										<label for="aktif">Status</label>
										<select id="aktif" name="aktif" class="form-control chosen">
											<option value="" style="display:none;">Pilih Data</option>
											<option value="1">Aktif</option>
											<option value="0">Tidak Aktif</option>
											<option value="2">Default</option>
										</select>
									</fieldset>
								</div>
							</div>

	                    </form>
	                </div>
	            </div>
				<div class="card-footer d-flex justify-content-end pt-0">
					<button type="button" class="btn bg-light-secondary compose-cancel-btn mr-2 batal">
						<i class="ft-x m-0 mr-sm-1"></i>
						<span class="d-sm-inline-block d-none">Batal</span>
					</button>
					<button type="button" class="btn-send btn btn-primary" id="simpan">
						<i class="ft-send m-0 mr-sm-1"></i>
						<span class="d-sm-inline-block d-none">Simpan</span>
					</button>
				</div>
	        </div>
	    </div>
	</div>
	
	<div class="row" id="div-tabel">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
					<div class="clearfix">
						<h4 class="card-title float-left">Data</h4>
						<div class="actions float-right">
							<button type="button" class="btn btn-primary mr-2" id="tambah" style="display:none;">
								<span class="d-flex align-items-center">
									<i class="ft-plus mr-1"></i>
									<span>Tambah</span>
								</span>
							</button>
						</div>
					</div>
                </div>
                <div class="card-body collapse show">
                    <div class="card-block card-dashboard">
                        <div class="table-responsive">
							<table id="tabel-ruh" class="table table-striped table-bordered">
								<thead>
									<tr>
										<th>No</th>
										<th>Username</th>
										<th>Nama</th>
										<th>NIK</th>
										<th>Level</th>
										<th>Unit</th>
										<th>Status</th>
										<th>Aksi</th>
									</tr>
								</thead>
								<tbody>
								</tbody>
							</table>
						</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
	
</section>

<script>
	$(document).ready(function(){

		var route = 'ref/user';
	
		$.fn.dataTable.ext.errMode = 'none';
		
		//aktivasi chosen
		$('.chosen').select2();
		
		//cek permission create
		$.get(route, function(result){
			if(result==1){ //admin
				$('#tambah').show();
			}
		});
				
		//ref level user
		$.get('dropdown/level', function(result){
			$('#kdlevel').html(result).trigger('change');
		});
		
		//ref perusahaan
		$.get('dropdown/unit/4', function(result){
			$('#kdunit').html(result).trigger('change');
		});
		
		$.extend({
			getValues: function(url) {
				var result = null;
				$.ajax({
					url: url,
					type: 'get',
					async: false,
					success: function(data) {
						result = data;
					}
				});
			   return result;
			}
		});
		
		var token1 = $.getValues('token');
		
		//tampilan default
		function form_default() {
			$('input,select,textarea').val('');
			$('.warning, #div-form').hide();
			$('#div-tabel').show();
			$('.chosen').trigger('change');
			$('#simpan').prop('disabled', false);
		}
		
		//aktivasi tampilan default
		form_default();
		
		//klik tambah
		$('#tambah').click(function(){
			$('#username,#nik').prop('disabled',false);
			$('#inp-rekambaru').val('1');
			$('#aktif').val('2').trigger('change');
			$('#div-form').show();
			$('#div-tabel').hide();
		});
		
		//data tabel
		var table = $('#tabel-ruh').DataTable({
			buttons: [
				{
					extend: 'excel',
					title: 'Ref Pengguna'
				},
				{
					extend: 'pdf',
					title: 'Ref Pengguna'
				},
				{
					extend: 'print',
					title: 'Ref Pengguna'
				}
			],
			processing: true,
			language:{
			    "decimal":        "",
			    "emptyTable":     "Tidak ada data tersedia",
			    "info":           "Menampilkan _START_ sampai _END_ dari _TOTAL_ entri",
			    "infoEmpty":      "Menampilkan 0 sampai 0 dari 0 entri",
			    "infoFiltered":   "(disaring dari _MAX_ total entri)",
			    "infoPostFix":    "",
			    "thousands":      ",",
			    "lengthMenu":     "Tampilkan _MENU_ entri",
			    "loadingRecords": "Proses Loading...",
			    "processing":     "Sedang Proses...",
			    "search":         "Cari:",
			    "zeroRecords":    "Tidak ditemukan data yang sesuai",
			    "paginate": {
			        "first":      "Awal",
			        "last":       "Akhir",
			        "next":       "Sesudah",
			        "previous":   "Sebelum"
			    },
			    "aria": {
			        "sortAscending":  ": aktifkan untuk mengurutkan kolom (asc)",
			        "sortDescending": ": aktifkan untuk mengurutkan kolom (desc)"
			    }
			},
			serverSide: true,
			ajax: {
				url: route + "/data",
			},
			columns: [
				{ data: "DT_RowIndex", name: "DT_RowIndex", className: "t-center", orderable: false, searchable: false },
				{ data: "username", name: "username", className: "t-left" },
				{ data: "nama", name: "nama", className: "t-left" },
				{ data: "nik", name: "nik", className: "t-left" },
				{ data: "nmlevel", name: "nmlevel", className: "t-left" },
				{ data: "nmunit", name: "nmunit", className: "t-left" },
				{ data: "aktif", name: "aktif", className: "t-left" },
				{ data: "aksi", name: "aksi", className: "t-center", orderable: false, searchable: false },
			],
		});
		
		//validasi isian form
		function form_valid(str_id){
			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if($('#'+arr_id[x]).val()==''){
					$('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
		
		//cari data user yang akan di edit berdasarkan id user
		function cari_data(id){
			$('.chosen').val('').trigger('change');
			$.getJSON(route + '/pilih/' + id, function(result){
				if(result.error==false) {
					var arr_level = result.kdlevel.split(",");
					var arr_unit = result.kdunit.split(",");
					$('#inp-id').val(id);
					$('#inp-rekambaru').val('0');
					$('#username').val(result.username);
					$('#nama').val(result.nama);
					$('#nik').val(result.nik);
					$('#email').val(result.email);
					$('#kdlevel').val(arr_level);
					$('#kdunit').val(arr_unit);
					$('#aktif').val(result.aktif);
					$('.chosen').trigger('change');
					$('#username,#nik').prop('disabled', true);
				}
			});
		}
		
		//klik ubah
		$('body').off('click', '.ubah').on('click', '.ubah', function(){
			var id = this.id;
			cari_data(id);
			$('#div-tabel').hide();
			$('#div-form').show();
			$('#inp-id').val(id);
			$('#inp-rekambaru').val('0');
		});
		
		//klik batal
		$('.batal').click(function(){
			form_default();
		});
		
		//klik simpan
		$('#simpan').click(function(){
			$(this).html('<span class="loading"><i class="fa fa-refresh"></i> Loading.....</span>');
			$(this).prop('disabled',true);
			var next = form_valid('username,nik,nama,email,kdlevel,aktif');
			if(next==true){
				$.get('token', function(token){
					if(token){
						$('#_token').val(token);
						var data = $('#form-ruh').serialize();
						$.ajax({
							url: route,
							method: 'POST',
							data: data,
							success: function(result){
								if(result=='success') {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log('Proses simpan berhasil');
									form_default();
									table.ajax.reload();
								} else {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log(result);
								} 
							},
							error: function(result){
								$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								$('#simpan').prop('disabled',false);
								alertify.log('Data tidak dapat disimpan. Koneksi pada aplikasi/database terputus atau data sudah pernah direkam atau format data salah. Hubungi Administrator.');
							}
						})
					} 
					else{
						$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						$('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
			}
			else{
				$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
				$('#simpan').prop('disabled',false);
				alertify.log('Data tidak dapat dikosongkan!');
			}
		});
		
		//hapus
		$('body').off('click', '.hapus').on('click', '.hapus', function(){
			var id = this.id;
			alertify.confirm('Hapus data ini?', function(c){
				if(c) {
					$.get('token', function(token){
						if(token) {
							$.ajax({
								url: route + '/hapus',
								method:'POST',
								data:{
									_token:token, 
									id:id
								},
								success:function(result){
									if(result=='success') {
										alertify.log('Proses hapus berhasil.');
										table.ajax.reload();
									} else {
										alertify.log(result);
									} 
								},
								error:function(result){
									alertify.log('Koneksi pada aplikasi/database terputus. Hubungi Administrator.');
								}
							});
						} else {
							alertify.log('Proses hapus gagal. Silahkan refresh halaman browser anda.');
						} 
					});
				} 
			});
		});
		
		//reset
		$('body').off('click', '.reset').on('click', '.reset', function(){
			var id = this.id;
			alertify.confirm('Reset data ini?', function(c){
				if(c) {
					$.get('token', function(token){
						if(token) {
							$.ajax({
								url: route + '/reset',
								method:'POST',
								data:{
									_token:token, 
									id:id
								},
								success:function(result){
									if(result=='success') {
										alertify.log('Proses reset berhasil.');
										table.ajax.reload();
									} else {
										alertify.log(result);
									} 
								},
								error:function(result){
									alertify.log('Koneksi pada aplikasi/database terputus. Hubungi Administrator.');
								}
							});
						} else {
							alertify.log('Proses reset gagal. Silahkan refresh halaman browser anda.');
						} 
					});
				} 
			});
		});
		
	});
	
</script>
