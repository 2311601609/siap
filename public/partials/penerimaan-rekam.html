<script>
	$(document).ready(function(){

		var route = 'penerimaan/rekam';
		
		function numberWithCommas(x) {
			return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
		}
		
		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}
		
		function cariNourut(){
			$.get('dropdown/nourut/2', function(result){
				$('#nourut').val(result);
			});
		}
	
		$.fn.dataTable.ext.errMode = 'none';
		
		$('.uang').inputmask('numeric', {
			radixPoint: '.',
			groupSeparator: ',',
			autoGroup: true,
			prefix: '',
			rightAlign: false,
			digits: 2,
			oncleared: function () {
				// Fungsi ini akan dipanggil saat input dihapus
				$(this).val('');
			}
		});
		
		//aktivasi chosen
		$('.chosen').select2();

		$.get('dropdown/unit/4', function(result){
			$('#kdunit').html(result).trigger('change');
		});
		
		$.get('dropdown/sdana', function(result){
			$('#kdsdana').html(result).trigger('change');
		});
		
		$.get('dropdown/alur-penerimaan', function(result){
			$('#id_alur').html(result).trigger('change');
		});
		
		$.get('dropdown/penerima', function(result){
			$('#id_pelanggan').html(result).trigger('change');
		});
		
		$.get('dropdown/transaksi', function(result){
			$('#kdtran').html(result).trigger('change');
		});
		
		$.get('dropdown/proyek', function(result){
			$('#id_proyek').html(result).trigger('change');
		});
		
		$.get('cek/level', function(result){
			if(result=='10' || result=='12'){ //admin
				$('#tambah').show();
			}
		});
		
		$('#id_alur').on('select2:select', function(){
			var id_alur = $(this).val();
			if(id_alur){
				$.get('dropdown/transaksi/'+id_alur, function(result){
					$('#kdtran').html(result).trigger('change');
				});
			}
		});
		
		$('#kdtran').on('select2:select', function(){
			var kdtran = $(this).val();
			if(kdtran){
				$.getJSON('penerimaan/rekam/tagihan/'+kdtran, function(result){
					if(result.error==false){
						$('#parent_id').html(result.dropdown).trigger('change');
						$('#div-tagihan').show();
					}
					else{
						$('#parent_id').html('').trigger('change');
						$('#div-tagihan').hide();
					}
					$('#id_proyek,#id_pelanggan,#kredit').prop('disabled', false).trigger('change');
					$.get('dropdown/akun/debet/'+kdtran, function(result){
						$('#debet').html(result).trigger('change');
					});
					$.get('dropdown/akun/kredit/'+kdtran, function(result){
						$('#kredit').html(result).trigger('change');
					});
				});
			}
		});
		
		$('#parent_id').on('select2:select', function(){
			if($(this).val()){
				var data = $(this).val().split('|');
				var proyek = data[5].split('-');
				$('#id_proyek').val(proyek[0]).trigger('change');
				$('#id_pelanggan').val(proyek[1]).trigger('change');
				$('#uraian').val(data[2]);
				$('#nilai').val(digit_grouping(data[3]));
				$('#kredit').val(data[4]).trigger('change');
				console.log(data);
				$('#id_proyek,#id_pelanggan,#kredit').prop('disabled', true).trigger('change');
			}
		});
		
		$('#id_dok').on('select2:select', function(){
			var id_dok = $(this).val();
			if(id_dok){
				$.get('dropdown/dokDetil/'+id_dok, function(result){
					$('#div-upload').html(result);
				});
			}
		});
		
		$('#id_proyek').on('select2:select', function(){
			if($(this).val()){
				var arr_id = $(this).val().split('-');
				$('#id_pelanggan').val(arr_id[1]).trigger('change');
			}
		});
		
		//tampilan default
		function form_default() {
			$('#id_proyek,#id_pelanggan,#kredit').prop('disabled', false).trigger('change');
			$('input,select,textarea').val('');
			$('#nilai_des').val('00');
			$('.warning, #div-form, #div-tagihan, #div-form-detil, #cari-nourut').hide();
			$('#div-tabel').show();
			$('.chosen').prop('disabled', false).trigger('change');
			$('#simpan').prop('disabled', false);
			$('#tabel-rincian').html('');
			$.getJSON('dropdown/akun-pajak/json', function(result){
				var akun='<option value="" style="display:none;">Pilih Akun</option>';
				$.each(result, function(i,field){
					akun+='<option value="'+field.kdakun+'|'+field.kddk+'|'+field.nilai+'">'+field.kdakun+' - '+field.nmakun+' ('+field.kddk+')</option>';
				});
				$('#inp-akun').val(akun);
			});
			$.get('dropdown/ttd/06', function(result){
				$('#ttd1').html(result).trigger('change');
			});
			
			$.get('dropdown/ttd/04', function(result){
				$('#ttd2').html(result).trigger('change');
			});
			
			$.get('dropdown/ttd/02', function(result){
				$('#ttd3').html(result).trigger('change');
			});
			
			$.get('dropdown/ttd/01', function(result){
				$('#ttd4').html(result).trigger('change');
			});
		}
		
		//aktivasi tampilan default
		form_default();
		
		//klik tambah
		$('#tambah').click(function(){
			$('#div-tabel').hide();
			$('#inp-rekambaru').val('1');
			$('#nilai,#ppn,#pph21,#pph22,#pph23,#pph25,#total').val(0);
			$('#div-form,#cari-nourut').show();
			cariNourut();
			$('#x').val(0);
			
			$('#tabel-rincian').html(
				'<tr id="tr-0">'+
					'<td>'+
						'<select id="chosen-0" class="form-control akun" name="rincian[0][\'kdakun\']" style="z-index:999999999 !important;">'+
							$('#inp-akun').val()+
						'</select>'+
					'</td>'+
					'<td><input id="nilai-0" style="text-align:right;" type="text" name="rincian[0][\'nilai\']" class="val_num"></td>'+
					'<td>'+
						'<center><a href="javascript:;" id="0" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
					'</td>'+
				'</tr>'
			);
			$('#nilai-0').inputmask('numeric', {
				radixPoint: '.',
				groupSeparator: ',',
				autoGroup: true,
				prefix: '',
				rightAlign: false,
				digits: 2,
				oncleared: function () {
					// Fungsi ini akan dipanggil saat input dihapus
					$(this).val('');
				}
			});
			$('#chosen-0').select2();
		});
		
		$('#tambah-detil').click(function(){
			var x=parseInt($('#x').val())+1;
			$('#tabel-rincian').append(
				'<tr id="tr-'+x+'">'+
					'<td>'+
						'<select id="chosen-'+x+'" class="form-control akun" name="rincian['+x+'][\'kdakun\']" style="z-index:999999999 !important;">'+
							$('#inp-akun').val()+
						'</select>'+
					'</td>'+
					'<td><input id="nilai-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="val_num"></td>'+
					'<td>'+
						'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
					'</td>'+
				'</tr>'
			);
			$('#chosen-'+x).select2();
			$('#nilai-'+x).inputmask('numeric', {
				radixPoint: '.',
				groupSeparator: ',',
				autoGroup: true,
				prefix: '',
				rightAlign: false,
				digits: 2,
				oncleared: function () {
					// Fungsi ini akan dipanggil saat input dihapus
					$(this).val('');
				}
			});
			$('#x').val(x);
		});
		
		$('body').off('click', '.hapus-detil').on('click', '.hapus-detil', function(){
			var id=this.id;
			$('#tr-'+id).remove();
		});
		
		// datatable init
        $("#exportPrint").on("click", function () {
            table.button('.buttons-print').trigger();
        });

		$("#exportPdf").on("click", function () {
            table.button('.buttons-pdf').trigger();
        });

		$("#exportExcel").on("click", function () {
            table.button('.buttons-excel').trigger();
        });

		//data tabel
		var table = $('#tabel-ruh').DataTable({
			buttons: [
                {
                    extend: 'print',
                    title: 'Rekam Penerimaan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
                {
                    extend: 'pdf',
                    title: 'Rekam Penerimaan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
				{
                    extend: 'excel',
					title: 'Rekam Penerimaan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
            ],
            lengthMenu: [
                [10, 25, 50, 100, -1],
                [10, 25, 50, 100, "Semua"],
            ],
			processing: true,
			language:{
			    "decimal":        "",
			    "emptyTable":     "Tidak ada data tersedia",
			    "info":           "Menampilkan _START_ sampai _END_ dari _TOTAL_ entri",
			    "infoEmpty":      "Menampilkan 0 sampai 0 dari 0 entri",
			    "infoFiltered":   "(disaring dari _MAX_ total entri)",
			    "infoPostFix":    "",
			    "thousands":      ",",

		//validasi isian form
		function form_valid(str_id){
			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if($('#'+arr_id[x]).val()==''){
					$('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
		
		//cari data user yang akan di edit berdasarkan id user
		function cari_data(id){
			$('.chosen').val('').trigger('change');
			$.getJSON('penerimaan/rekam/pilih/'+id, function(result){
				if(result.error==false) {
				
					$.get('dropdown/transaksi/'+result.message.id_alur, function(result1){
						$('#kdtran').html(result1).trigger('change');
						$('#kdtran').val(result.message.kdtran).trigger('change');
					});
					
					if(result.message.parent_id!=='0'){
						$('#parent_id').html(result.tagihan).trigger('change');
						$('#div-tagihan').show();
						$('#id_pelanggan,#kredit').prop('disabled', true).trigger('change');
					}
					else{
						$('#div-tagihan').hide();
						$('#id_pelanggan,#kredit').prop('disabled', false).trigger('change');
					}
					
					$('#tabel-rincian').html('');
					$.each(result.akun, function(x,row){
						$('#tabel-rincian').append(
							'<tr id="tr-'+x+'">'+
								'<td>'+
									'<select id="chosen-'+x+'" class="form-control akun" name="rincian['+x+'][\'kdakun\']" style="z-index:999999999 !important;">'+
										$('#inp-akun').val()+
									'</select>'+
								'</td>'+
								'<td><input id="nilai-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="val_num" value="'+digit_grouping(row.nilai)+'"></td>'+
								'<td>'+
									'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
								'</td>'+
							'</tr>'
						);
						$('#chosen-'+x).val(row.kdakun+'|'+row.kddk+'|'+row.nilai1);
						$('#chosen-'+x).select2();
						$('#nilai-'+x).inputmask('numeric', {
							radixPoint: '.',
							groupSeparator: ',',
							autoGroup: true,
							prefix: '',
							rightAlign: false,
							digits: 2,
							oncleared: function () {
								// Fungsi ini akan dipanggil saat input dihapus
								$(this).val('');
							}
						});
					});
					
					$('#debet').html(result.dropdown_d).trigger('change');
					$('#kredit').html(result.dropdown_k).trigger('change');
					
					$('#inp-id').val(id);
					$('#inp-rekambaru').val('0');
					$('#x').val(result.x);
					$('#kdunit').val(result.message.kdunit);
					$('#kdsdana').val(result.message.kdsdana);
					$('#id_alur').val(result.message.id_alur);
					$('#id_proyek').val(result.message.id_proyek);
					$('#id_pelanggan').val(result.message.id_pelanggan);
					$('#nopks').val(result.message.nopks);
					$('#tgpks').val(result.message.tgpks);
					$('#tgjtempo').val(result.message.tgjtempo);
					$('#uraian').val(result.message.uraian);
					$('#nourut').val(result.message.nourut);
					$('#nocek').val(result.message.nocek);
					$('#tgcek').val(result.message.tgcek);
					$('#ttd1').val(result.message.ttd1);
					$('#ttd2').val(result.message.ttd2);
					$('#ttd3').val(result.message.ttd3);
					$('#ttd4').val(result.message.ttd4);
					$('#nilai').val(digit_grouping(result.message.nilai));
					$('#nilai_des').val(result.message.nilai_des);
					$('#total').val(digit_grouping(result.message.total));
					$('#ppn').val(digit_grouping(result.message.ppn));
					$('#pph21').val(digit_grouping(result.message.pph21));
					$('#pph22').val(digit_grouping(result.message.pph22));
					$('#pph23').val(digit_grouping(result.message.pph23));
					$('#pph25').val(digit_grouping(result.message.pph25));
					$('#total').val(digit_grouping(result.message.total));
					$('.chosen').trigger('change');
				}
				else{
					alertify.log(result.message);
				}
			});
		}
