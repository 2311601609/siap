<section>
	
	<div class="row">
        <div class="col-sm-12">
            <div class="content-header">Pembukuan/ Saldo Awal</div>
        </div>
    </div>
	
	<div class="row" id="div-form">
	    <div class="col-md-12">
	        <div class="card">
	            <div class="card-header">
	                <h4 class="card-title" id="horz-layout-basic">Form</h4>
	            </div>
	            <div class="card-body">
	                <div class="px-3">
	                    <form id="form-ruh" class="form form-horizontal">
	                    	<input type="hidden" id="inp-rekambaru" name="inp-rekambaru">
							<input type="hidden" id="inp-id" name="inp-id">
							<input type="hidden" id="_token" name="_token">

							<div class="row">
								<div class="col-md-6">
									<fieldset class="form-group">
										<label for="id_proyek">Proyek</label>
										<select id="id_proyek" name="id_proyek" class="form-control chosen">
										</select>
									</fieldset>
									<fieldset class="form-group">
										<label for="kdakun">Akun/ COA</label>
										<select id="kdakun" name="kdakun" class="form-control chosen">
										</select>
									</fieldset>
									<fieldset class="form-group">
										<label for="kddk">Debet/ Kredit</label>
										<select id="kddk" name="kddk" class="form-control chosen">
											<option value="" style="display:none;">Pilih Data</option>
											<option value="D">Debet</option>
											<option value="K">Kredit</option>
										</select>
									</fieldset>
								</div>
								<div class="col-md-6">
									<fieldset class="form-group">
										<label for="nilai">Nilai</label>
										<input type="text" id="nilai" name="nilai" class="form-control uang" style="text-align:right;" maxlength="20">
									</fieldset>
									<fieldset class="form-group">
										<label for="kdplus">Plus/ Minus</label>
										<select id="kdplus" name="kdplus" class="form-control chosen">
											<option value="">Plus</option>
											<option value="-">Minus</option>
										</select>
									</fieldset>
									<fieldset class="form-group">
										<label for="tgsawal">Tanggal Buku</label>
										<input type="date" id="tgsawal" name="tgsawal" class="form-control" maxlength="10">
									</fieldset>
								</div>
							</div>
	                    </form>
	                </div>
	            </div>
				<div class="card-footer d-flex justify-content-end pt-0">
					<button type="button" class="btn bg-light-secondary compose-cancel-btn mr-2 batal">
						<i class="ft-x m-0 mr-sm-1"></i>
						<span class="d-sm-inline-block d-none">Batal</span>
					</button>
					<button type="button" class="btn-send btn btn-primary" id="simpan">
						<i class="ft-send m-0 mr-sm-1"></i>
						<span class="d-sm-inline-block d-none">Simpan</span>
					</button>
				</div>
	        </div>
	    </div>
	</div>
	
	<div class="row" id="div-tabel">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
					<div class="clearfix">
						<h4 class="card-title float-left">Data</h4>
						<div class="actions float-right">
							<button type="button" class="btn btn-primary mr-1" id="exportPrint">
								<span class="d-flex align-items-center">
									<span>Cetak</span>
								</span>
							</button>
							<button type="button" class="btn btn-primary mr-1" id="exportPdf">
								<span class="d-flex align-items-center">
									<span>PDF</span>
								</span>
							</button>
							<button type="button" class="btn btn-primary mr-1" id="exportExcel">
								<span class="d-flex align-items-center">
									<span>XLS</span>
								</span>
							</button>
							<button type="button" class="btn btn-primary mr-2" id="tambah" style="display:none;">
								<span class="d-flex align-items-center">
									<i class="ft-plus mr-1"></i>
									<span>Tambah</span>
								</span>
							</button>
						</div>
					</div>
                </div>
                <div class="card-body collapse show">
                    <div class="card-block card-dashboard">
                        <div class="table-responsive">
							<table id="tabel-ruh" class="table table-striped table-bordered">
								<thead>
									<tr>
										<th>No</th>
										<th>Proyek</th>
										<th>Akun</th>
										<th>Debet</th>
										<th>Kredit</th>
										<th>Tgl.Posting</th>
										<th>Tgl.Rekam</th>
										<th>Aksi</th>
									</tr>
								</thead>
								<tbody>
								</tbody>
								<tfoot class="text-primary">
									<tr>
										<td colspan="3" style="text-align:center;">Total</td>
										<td id="debet" style="text-align:right;">0</td>
										<td id="kredit" style="text-align:right;">0</td>
										<td></td>
										<td></td>
										<td></td>
									</tr>
								</tfoot>
							</table>
						</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
	
</section>

<script>
	$(document).ready(function(){

		var route = 'pembukuan/saldo-awal';
	
		$.fn.dataTable.ext.errMode = 'none';
		
		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}
		
		$('.uang').mask('000,000,000,000,000', {reverse: true});
		
		//aktivasi chosen
		$('.chosen').select2();
		
		$.get('dropdown/lap', function(result){
			$('#kdlap').html(result).trigger('change');
		});
		
		$.get('dropdown/akun/html/all?kdlap=NR', function(result){
			$('#kdakun').html(result).trigger('change');
		});
		
		$.get('dropdown/proyek', function(result){
			$('#id_proyek').html(result).trigger('change');
		});
		
		$('#kdlap').on('select2:select', function(){
			var kdlap = $(this).val();
			$.get('dropdown/akun/html/level1?kdlap='+kdlap, function(result){
				$('#kdakun').html(result).trigger('change');
			});
		});
		
		//cek permission create
		$.get(route, function(result){
			if(result==1){ //admin
				$('#tambah').show();
			}
		});
		
		//tampilan default
		function form_default() {
			$('input,select').val('');
			$('.warning, #div-form').hide();
			$('#div-tabel').show();
			$('.chosen').prop('disabled', false).trigger('change');
			$('#simpan').prop('disabled', false);
		}
		
		//aktivasi tampilan default
		form_default();
		
		//klik tambah
		$('#tambah').click(function(){
			$('#inp-rekambaru').val('1');
			$('#div-tabel').hide();
			$('#div-form').show();
		});

		// datatable init
        $("#exportPrint").on("click", function () {
            table.button('.buttons-print').trigger();
        });

		$("#exportPdf").on("click", function () {
            table.button('.buttons-pdf').trigger();
        });

		$("#exportExcel").on("click", function () {
            table.button('.buttons-excel').trigger();
        });

		//data tabel
		var table=$('#tabel-ruh').DataTable({
			buttons: [
				{
					extend: 'excel',
					title: 'Saldo Awal'
				},
				{
					extend: 'pdf',
					title: 'Saldo Awal'
				},
				{
					extend: 'print',
					title: 'Saldo Awal'
				}
			],
			processing: true,
			language:{
			    "decimal":        "",
			    "emptyTable":     "Tidak ada data tersedia",
			    "info":           "Menampilkan _START_ sampai _END_ dari _TOTAL_ entri",
			    "infoEmpty":      "Menampilkan 0 sampai 0 dari 0 entri",
			    "infoFiltered":   "(disaring dari _MAX_ total entri)",
			    "infoPostFix":    "",
			    "thousands":      ",",
			    "lengthMenu":     "Tampilkan _MENU_ entri",
			    "loadingRecords": "Proses Loading...",
			    "processing":     "Sedang Proses...",
			    "search":         "Cari:",
			    "zeroRecords":    "Tidak ditemukan data yang sesuai",
			    "paginate": {
			        "first":      "Awal",
			        "last":       "Akhir",
			        "next":       "Sesudah",
			        "previous":   "Sebelum"
			    },
			    "aria": {
			        "sortAscending":  ": aktifkan untuk mengurutkan kolom (asc)",
			        "sortDescending": ": aktifkan untuk mengurutkan kolom (desc)"
			    }
			},
			serverSide: true,
			ajax: {
				url: route + "/data",
			},
			columns: [
				{ data: "DT_RowIndex", name: "DT_RowIndex", className: "t-center", orderable: false, searchable: false },
				{ data: "nmproyek", name: "nmproyek", className: "t-left" },
				{ data: "kdakun", name: "kdakun", className: "t-left" },
				{ data: "debet", name: "debet", className: "t-right" },
				{ data: "kredit", name: "kredit", className: "t-right" },
				{ data: "tgsawal", name: "tgsawal", className: "t-left" },
				{ data: "created_at", name: "created_at", className: "t-left" },
				{ data: "aksi", name: "aksi", className: "t-center", orderable: false, searchable: false },
			],
			initComplete: function() {
				$.getJSON(route+'/total', function(result){
					if(result){
						$('#debet').html(result.debet);
						$('#kredit').html(result.kredit);
					}
				});
			}
		});
		
		//pencarian by enter
		$('#tabel-ruh_filter input').unbind();
		$('#tabel-ruh_filter input').bind('keyup', function(e) {
			if(e.keyCode == 13) {
				table.search(this.value).draw();
				
				$.getJSON(route+'/total?param='+this.value, function(result){
					if(result){
						$('#debet').html(result.debet);
						$('#kredit').html(result.kredit);
					}
				});
			}
		});
		
		//validasi isian form
		function form_valid(str_id){
			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if($('#'+arr_id[x]).val()==''){
					$('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
		
		//cari data user yang akan di edit berdasarkan id user
		function cari_data(id){
			$('.chosen').val('').trigger('change');
			$.getJSON(route+'/pilih/'+id, function(result){
				if(result.error==false) {
					$('#inp-id').val(id);
					$('#inp-rekambaru').val('0');
					$('#kdakun').val(result.message.kdakun).prop('disabled', true);
					$('#kddk').val(result.message.kddk);
					$('#kdplus').val(result.message.kdplus);
					$('#id_proyek').val(result.message.id_proyek).prop('disabled', true);
					$('#nilai').val(digit_grouping(result.message.nilai));
					$('#tgsawal').val(result.message.tgsawal);
					$('.chosen').trigger('change');
				}
				else{
					alertify.log(result.message);
				}
			});
		}
		
		//klik ubah
		$('body').off('click', '.ubah').on('click', '.ubah', function(){
			var id = this.id;
			$('#div-tabel').hide();
			$('#div-form').show();
			cari_data(id);
		});
		
		//klik batal
		$('.batal').click(function(){
			form_default();
		});
		
		//klik simpan
		$('#simpan').click(function(){
			$(this).html('<span class="loading"><i class="fa fa-refresh"></i> Loading.....</span>');
			$(this).prop('disabled',true);
			var next = form_valid('kdlap,kdakun,tgsawal,nilai,id_proyek');
			if(next==true){
				$.get('token', function(token){
					if(token){
						$('#_token').val(token);
						var data = $('#form-ruh').serialize();
						$.ajax({
							url: route,
							method: 'POST',
							data: data,
							success: function(result){
								if(result=='success') {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log('Proses simpan berhasil');
									form_default();
									table.ajax.reload();
									$.getJSON('pembukuan/saldo-awal/total', function(result){
										if(result){
											$('#debet').html(result.debet);
											$('#kredit').html(result.kredit);
										}
									});
								} else {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log(result);
								} 
							},
							error: function(result){
								$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								$('#simpan').prop('disabled',false);
								alertify.log('Data tidak dapat disimpan. Koneksi pada aplikasi/database terputus atau data sudah pernah direkam atau format data salah. Hubungi Administrator.');
							}
						})
					} 
					else{
						$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						$('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
			}
			else{
				$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
				$('#simpan').prop('disabled',false);
				alertify.log('Data tidak dapat dikosongkan!');
			}
		});
		
		//hapus
		$('body').off('click', '.hapus').on('click', '.hapus', function(){
			var id = this.id;
			alertify.confirm('Hapus data ini?', function(c){
				if(c) {
					$.get('token', function(token){
						if(token) {
							$.ajax({
								url:route+'/hapus',
								method:'POST',
								data:{
									_token:token, 
									id:id
								},
								success:function(result){
									if(result=='success') {
										alertify.log('Proses hapus berhasil.');
										table.ajax.reload();
										$.getJSON('pembukuan/saldo-awal/total', function(result){
											if(result){
												$('#debet').html(result.debet);
												$('#kredit').html(result.kredit);
											}
										});
									} else {
										alertify.log(result);
									}
								},
								error:function(result){
									alertify.log('Koneksi pada aplikasi/database terputus. Hubungi Administrator.');
								}
							});
						} else {
							alertify.log('Proses hapus gagal. Silahkan refresh halaman browser anda.');
						} 
					});
				} 
			});
		});
		
	});
	
</script>
