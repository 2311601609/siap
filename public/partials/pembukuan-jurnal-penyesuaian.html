<section>

	<div class="row" id="div-form">

											<table class="table table-bordered">
												<thead>
													<tr>

												</tbody>
											</table>

								<div class="col-md-2">
									<fieldset class="form-group">
										<label></label>
										<br>
										<button type="button" class="btn btn-primary mr-2" id="tambah-detil">
											<span class="d-flex align-items-center">
												<i class="ft-plus mr-1"></i>
												<span>Tambah Rincian</span>

	                    </form>
	                </div>
	            </div>
				<div class="card-footer d-flex justify-content-end pt-0">
					<button type="button" class="btn bg-light-secondary compose-cancel-btn mr-2 batal">
						<i class="ft-x m-0 mr-sm-1"></i>
						<span class="d-sm-inline-block d-none">Batal</span>
					</button>
					<button type="button" class="btn-send btn btn-primary" id="simpan">
						<i class="ft-send m-0 mr-sm-1"></i>
						<span class="d-sm-inline-block d-none">Simpan</span>
					</button>
				</div>
	        </div>
	    </div>
	</div>
	
	<div class="row" id="div-tabel">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
					<div class="clearfix">
						<h4 class="card-title float-left">Data</h4>
						<div class="actions float-right">
							<button type="button" class="btn btn-primary mr-1" id="exportPrint">
								<span class="d-flex align-items-center">
									<span>Cetak</span>
								</span>
							</button>
							<button type="button" class="btn btn-primary mr-1" id="exportPdf">
								<span class="d-flex align-items-center">
									<span>PDF</span>
								</span>
							</button>
							<button type="button" class="btn btn-primary mr-1" id="exportExcel">
								<span class="d-flex align-items-center">
									<span>XLS</span>
								</span>
							</button>
							<button type="button" class="btn btn-primary mr-2" id="tambah" style="display:none;">
								<span class="d-flex align-items-center">
									<i class="ft-plus mr-1"></i>
									<span>Tambah</span>
								</span>
							</button>
						</div>
					</div>
                </div>
                <div class="card-body collapse show">
                    <div class="card-block card-dashboard">
                        <div class="table-responsive">
							<table id="tabel-ruh" class="table table-striped table-bordered">
								<thead>
									<tr>
										<th></th>
										<th>No.Trans</th>
										<th>Jenis</th>
										<th>Proyek</th>
										<th>No.Bukti</th>
										<th>Uraian</th>
										<th>Nilai</th>
										<th>Aksi</th>
									</tr>
								</thead>
								<tbody>
								</tbody>
							</table>
						</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
	
</section>

<script>
	$(document).ready(function(){
	
		$.fn.dataTable.ext.errMode = 'none';
			
		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}
		
		function cariNourut(){
			$.get('dropdown/nourut/5', function(result){
				$('#nourut').val(result);
			});
		}
		
		//aktivasi chosen
		$('.chosen').select2();
		
		$.get('dropdown/transaksi/10', function(result){
			$('#kdtran').html(result).trigger('change');
		});
		
		$.get('dropdown/proyek', function(result){
			$('#id_proyek').html(result).trigger('change');
		});
		
		$.get('cek/level', function(result){
			if(result=='00'){ //admin
				$('#tambah').show();
			}
		});
		
		$.getJSON('dropdown/akun/json', function(result){
			var akun='';
			$.each(result, function(i,field){
				akun+='<option value="'+field.kdakun+'">'+field.kdakun+' - '+field.nmakun+'</option>';
			});
			$('#inp-akun').val(akun);
		});
		
		//tampilan default
		function form_default() {
			$('#id_alur,#id_output,#id_penerima,#nobukti,#tgbukti,#uraian').val('');
			$('.warning, #div-form, #cari-nourut').hide();
			$('#div-tabel').show();
			$('#id_alur,#id_output,#id_penerima').trigger('change');
			$('#simpan').prop('disabled', false);
		}
		
		//aktivasi tampilan default
		form_default();
		
		//klik tambah
		$('#tambah').click(function(){
			$('#div-tabel').hide();
			$('#inp-rekambaru').val('1');
			$('#div-form, #cari-nourut').show();
			$('#x').val(0);
			
			$('#tabel-rincian').html(
				'<tr id="tr-0">'+
					'<td>'+
						'<select id="chosen0" class="form-control akun" name="rincian[0][\'kdakun\']">'+
							$('#inp-akun').val()+
						'</select>'+
					'</td>'+
					'<td>'+
						'<select id="dk-0" class="form-control" name="rincian[0][\'kddk\']">'+
							'<option value="D">D</option>'+
							'<option value="K">K</option>'+
						'</select>'+
					'</td>'+
					'<td><input style="text-align:right;" type="text" name="rincian[0][\'nilai\']" class="val_num"></td>'+
					'<td>'+
						'<center><a href="javascript:;" id="0" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
					'</td>'+
				'</tr>'
			);
			$('.val_num').mask('000,000,000,000,000', {reverse: true});
			$('#chosen0').select2({width:'100%'});
			$('#dk-0').select2({width:'100%'});
			cariNourut();
		});
		
		$('#tambah-detil').click(function(){
			var x=parseInt($('#x').val())+1;
			$('#tabel-rincian').append(
				'<tr id="tr-'+x+'">'+
					'<td>'+
						'<select id="chosen'+x+'" class="form-control akun" name="rincian['+x+'][\'kdakun\']">'+
							$('#inp-akun').val()+
						'</select>'+
					'</td>'+
					'<td>'+
						'<select id="dk-'+x+'" class="form-control" name="rincian['+x+'][\'kddk\']">'+
							'<option value="D">D</option>'+
							'<option value="K">K</option>'+
						'</select>'+
					'</td>'+
					'<td><input style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="val_num"></td>'+
					'<td>'+
						'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
					'</td>'+
				'</tr>'
			);
			$('#chosen'+x).select2({width:'100%'});
			$('#dk-'+x).select2({width:'100%'});
			$('.val_num').mask('000,000,000,000,000', {reverse: true});
			$('#x').val(x);
		});
		
		$('body').off('click', '.hapus-detil').on('click', '.hapus-detil', function(){
			var id=this.id;
			$('#tr-'+id).remove();
		});

		// datatable init
        $("#exportPrint").on("click", function () {
            table.button('.buttons-print').trigger();
        });

		$("#exportPdf").on("click", function () {
            table.button('.buttons-pdf').trigger();
        });

		$("#exportExcel").on("click", function () {
            table.button('.buttons-excel').trigger();
        });
		
		//data tabel
		var table=$('#tabel-ruh').DataTable({
			buttons: [
				{
					extend: 'excel',
					title: 'Jurnal Penyesuaian'
				},
				{
					extend: 'pdf',
					title: 'Jurnal Penyesuaian'
				},
				{
					extend: 'print',
					title: 'Jurnal Penyesuaian'
				}
			],
			bProcessing:true,
			language:{
			    "decimal":        "",
			    "emptyTable":     "Tidak ada data tersedia",
			    "info":           "Menampilkan _START_ sampai _END_ dari _TOTAL_ entri",
			    "infoEmpty":      "Menampilkan 0 sampai 0 dari 0 entri",
			    "infoFiltered":   "(disaring dari _MAX_ total entri)",
			    "infoPostFix":    "",
			    "thousands":      ",",
			    "lengthMenu":     "Tampilkan _MENU_ entri",
			    "loadingRecords": "Proses Loading...",
			    "processing":     "Sedang Proses...",
			    "search":         "Cari:",
			    "zeroRecords":    "Tidak ditemukan data yang sesuai",
			    "paginate": {
			        "first":      "Awal",
			        "last":       "Akhir",
			        "next":       "Sesudah",
			        "previous":   "Sebelum"
			    },
			    "aria": {
			        "sortAscending":  ": aktifkan untuk mengurutkan kolom (asc)",
			        "sortDescending": ": aktifkan untuk mengurutkan kolom (desc)"
			    }
			},
			"columns": [
				{
					"className":      'details-control',
					"orderable":      false,
					"data":      null,
					"defaultContent": ''
				},
				{},
				{},
				{},
				{},
				{},
				{},
				{}
			],
			bServerSide: true,
			ajax:{
				url: "pembukuan/jurnal-penyesuaian", // Change this URL to where your json data comes from
				type: "GET"
			},
			fnCreatedRow: function( nRow, aData, iDataIndex ) {
				$(nRow).attr('id', aData[0]);
			}
		});
		
		//klik detil
		$('#tabel-ruh').off('click', 'td.details-control').on('click', 'td.details-control', function () {
			var tr = $(this).closest('tr');
			var row = table.row( tr );
	 
			if ( row.child.isShown() ) {
				// This row is already open - close it
				var id=$(this).parent().attr('id');
				row.child.hide();
				tr.removeClass('shown');
			}
			else {
				var id=$(this).parent().attr('id');
				
				if(id!=''){
					$.getJSON('pembukuan/jurnal-penyesuaian/detil/'+id, function(result){
						if(result.error==false){
							// Open this row
							row.child( result.message).show();
							tr.addClass('shown');
						}
						else{
							alertify.log('Data detil tidak ditemukan!');
						}
					});
				}
				else{
					alertify.log('Tidak ada data detil...');
				}
			}
		});
		
		//validasi isian form
		function form_valid(str_id){
			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if($('#'+arr_id[x]).val()==''){
					$('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
		
		//cari data user yang akan di edit berdasarkan id user
		function cari_data(id){
			$('.chosen').val('').trigger('change');
			$.getJSON('pembukuan/jurnal-penyesuaian/pilih/'+id, function(result){
				if(result.error==false) {
					$('#inp-id').val(id);
					$('#inp-rekambaru').val('0');
					$('#kdtran').val(result.message.kdtran);
					$('#nourut').val(result.message.nourut);
					$('#nobukti').val(result.message.nobukti);
					$('#tgbukti').val(result.message.tgbukti);
					$('#uraian').val(result.message.uraian);
					$('#id_proyek').val(result.message.id_proyek);
					
					$('#tabel-rincian').html('');
					$.each(result.akun, function(x,row){
						
						$('#tabel-rincian').append(
							'<tr id="tr-'+x+'">'+
								'<td>'+
									'<select id="chosen'+x+'" class="form-control akun chosen" name="rincian['+x+'][\'kdakun\']">'+
										$('#inp-akun').val()+
									'</select>'+
								'</td>'+
								'<td>'+
									'<select id="dk-'+x+'" class="form-control chosen" name="rincian['+x+'][\'kddk\']">'+
										'<option value="D">D</option>'+
										'<option value="K">K</option>'+
									'</select>'+
								'</td>'+
								'<td><input style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="val_num" value="'+digit_grouping(row.nilai)+'"></td>'+
								'<td>'+
									'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
								'</td>'+
							'</tr>'
						);
						$('#chosen'+x).val(row.kdakun);
						$('#dk-'+x).val(row.kddk);
						$('#chosen'+x).select2({width:'100%'});
						$('#dk-'+x).select2({width:'100%'});
						$('.val_num').mask('000,000,000,000,000', {reverse: true});
					});
					
					$('.chosen').trigger('change');
				}
				else{
					alertify.log(result.message);
				}
			});
		}
		
		//klik ubah
		$('body').off('click', '.ubah').on('click', '.ubah', function(){
			var id = this.id;
			$('#div-tabel').hide();
			$('#div-form').show();
			cari_data(id);
		});
		
		//klik batal
		$('.batal').click(function(){
			form_default();
		});
		
		//klik refresh nomor transaksi
		$('#cari-nourut').click(function(){
			cariNourut();
		});
		
		//klik simpan
		$('#simpan').click(function(){
			$(this).html('<span class="loading"><i class="fa fa-refresh"></i> Loading.....</span>');
			$(this).prop('disabled',true);
			var next = form_valid('id_proyek,id_alur,id_output,id_penerima,notrans,nobukti,tgbukti,uraian');
			if(next==true){
				$.get('token', function(token){
					if(token){
						$('#_token').val(token);
						var data = $('#form-ruh').serialize();
						$.ajax({
							url: 'pembukuan/jurnal-penyesuaian',
							method: 'POST',
							data: data,
							success: function(result){
								if(result=='success') {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log('Proses simpan berhasil');
									form_default();
									table.ajax.reload();
								} else {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log(result);
								} 
							},
							error: function(result){
								$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								$('#simpan').prop('disabled',false);
								alertify.log('Data tidak dapat disimpan. Koneksi pada aplikasi/database terputus atau data sudah pernah direkam atau format data salah. Hubungi Administrator.');
							}
						})
					} 
					else{
						$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						$('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
			}
			else{
				$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
				$('#simpan').prop('disabled',false);
				alertify.log('Data tidak dapat dikosongkan!');
			}
		});
		
		//hapus
		$('body').off('click', '.hapus').on('click', '.hapus', function(){
			var id = this.id;
			alertify.confirm('Hapus data ini?', function(c){
				if(c) {
					$.get('token', function(token){
						if(token) {
							$.ajax({
								url:'pembukuan/jurnal-penyesuaian/hapus',
								method:'POST',
								data:{
									_token:token, 
									id:id
								},
								success:function(result){
									if(result=='success') {
										alertify.log('Proses hapus berhasil.');
										table.ajax.reload();
									} else {
										alertify.log(result);
									}
								},
								error:function(result){
									alertify.log('Koneksi pada aplikasi/database terputus. Hubungi Administrator.');
								}
							});
						} else {
							alertify.log('Proses hapus gagal. Silahkan refresh halaman browser anda.');
						} 
					});
				} 
			});
		});
		
	});
	
</script>
