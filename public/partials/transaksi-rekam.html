<script>
	jQuery(document).ready(function(){
	
		jQuery.fn.dataTable.ext.errMode = 'none';
			
		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}
		
		jQuery('#fileupload1').click(function(){
			jQuery('#progress1 .progress-bar').css('width', 0);
			jQuery('#progress1 .progress-bar').html('');
			jQuery('#nmfile1').html('');
		});
		
		jQuery.get('token', function(result){
			
			//upload adk
			jQuery('#fileupload1').fileupload({
				url:'transaksi/rekam/upload',
				dataType: 'json',
				formData:{
					_token: result
				},
				done: function (e, data) {
					jQuery('#nmfile1').html(data.files[0].name);
					alertify.log('Data berhasil diupload!');
				},
				error: function(error) {
					alertify.log(error.responseText);
				},
				progressall: function (e, data) {
					var progress = parseInt(data.loaded / data.total * 100, 10);
					jQuery('#progress1 .progress-bar').css('width',progress + '%');
				}
			}).prop('disabled', !$.support.fileInput)
			  .parent().addClass($.support.fileInput ? undefined : 'disabled');
			
		});
		
		//aktivasi chosen
		jQuery('.chosen').select2();
		
		jQuery.get('dropdown/alur', function(result){
			jQuery('#id_alur').html(result).trigger('change');
		});
		
		jQuery.get('dropdown/output', function(result){
			jQuery('#id_output').html(result).trigger('change');
		});
		
		jQuery.get('dropdown/kegiatan', function(result){
			jQuery('#id_giat').html(result).trigger('change');
		});
		
		jQuery.get('dropdown/penerima', function(result){
			jQuery('#id_penerima').html(result).trigger('change');
		});
		
		jQuery.get('dropdown/transaksi', function(result){
			jQuery('#kdtran').html(result).trigger('change');
		});
		
		jQuery('#kdtran').change(function(){
			var kdtran = jQuery(this).val();
			jQuery.get('ref/transaksi/detil1/'+kdtran, function(result){
				if(result.error==false){
					jQuery('#tabel-rincian').html(result.message);
					jQuery('.val_num').mask('000,000,000,000,000', {reverse: true});
				}
			});
		});
		
		jQuery.get('cek/level', function(result){
			if(result=='01'){ //admin
				jQuery('#tambah').show();
			}
		});
		
		//tampilan default
		function form_default() {
			jQuery('input,select,textarea').val('');
			jQuery('.warning, #div-form').hide();
			jQuery('#div-tabel').show();
			jQuery('.chosen').trigger('change');
			jQuery('#simpan').prop('disabled', false);
			jQuery('#tabel-rincian').html('');
		}
		
		//aktivasi tampilan default
		form_default();
		
		//klik tambah
		jQuery('#tambah').click(function(){
			jQuery('#div-tabel').hide();
			jQuery.getJSON('transaksi/rekam/nomor', function(result){
				jQuery('#notrans').val(result);
				jQuery('#inp-rekambaru').val('1');
				jQuery('#div-form').show();
				jQuery('#x').val(0);
			});
		});
		
		//data tabel
		var table=jQuery('#tabel-ruh').DataTable({
			bProcessing:true,
			language:{
			    "decimal":        "",
			    "emptyTable":     "Tidak ada data tersedia",
			    "info":           "Menampilkan _START_ sampai _END_ dari _TOTAL_ entri",
			    "infoEmpty":      "Menampilkan 0 sampai 0 dari 0 entri",
			    "infoFiltered":   "(disaring dari _MAX_ total entri)",
			    "infoPostFix":    "",
			    "thousands":      ",",
			    "lengthMenu":     "Tampilkan _MENU_ entri",
			    "loadingRecords": "Proses Loading...",
			    "processing":     "Sedang Proses...",
			    "search":         "Cari:",
			    "zeroRecords":    "Tidak ditemukan data yang sesuai",
			    "paginate": {
			        "first":      "Awal",
			        "last":       "Akhir",
			        "next":       "Sesudah",
			        "previous":   "Sebelum"
			    },
			    "aria": {
			        "sortAscending":  ": aktifkan untuk mengurutkan kolom (asc)",
			        "sortDescending": ": aktifkan untuk mengurutkan kolom (desc)"
			    }
			},
			"columns": [
				{
					"className":      'details-control',
					"orderable":      false,
					"data":      null,
					"defaultContent": ''
				},
				{},
				{},
				{},
				{},
				{},
				{},
				{},
				{}
			],
			bServerSide: true,
			ajax:{
				url: "transaksi/rekam", // Change this URL to where your json data comes from
				type: "GET"
			},
			fnCreatedRow: function( nRow, aData, iDataIndex ) {
				jQuery(nRow).attr('id', aData[0]);
			}
		});
		
		//klik detil
		jQuery('#tabel-ruh').off('click', 'td.details-control').on('click', 'td.details-control', function () {
			var tr = jQuery(this).closest('tr');
			var row = table.row( tr );
	 
			if ( row.child.isShown() ) {
				// This row is already open - close it
				var id=jQuery(this).parent().attr('id');
				row.child.hide();
				tr.removeClass('shown');
			}
			else {
				var id=jQuery(this).parent().attr('id');
				
				if(id!=''){
					jQuery.getJSON('transaksi/rekam/detil/'+id, function(result){
						if(result.error==false){
							// Open this row
							row.child( result.message).show();
							tr.addClass('shown');
						}
						else{
							alertify.log('Data detil tidak ditemukan!');
						}
					});
				}
				else{
					alertify.log('Tidak ada data detil...');
				}
			}
		});
		
		//validasi isian form
		function form_valid(str_id){
			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if(jQuery('#'+arr_id[x]).val()==''){
					jQuery('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
		
		//cari data user yang akan di edit berdasarkan id user
		function cari_data(id){
			jQuery('.chosen').val('').trigger('change');
			jQuery.getJSON('transaksi/rekam/pilih/'+id, function(result){
				if(result.error==false) {
					jQuery('#inp-id').val(id);
					jQuery('#inp-rekambaru').val('0');
					jQuery('#id_alur').val(result.message.id_alur);
					jQuery('#id_output').val(result.message.id_output);
					jQuery('#id_giat').val(result.message.id_giat);
					jQuery('#kdtran').val(result.message.kdtran);
					jQuery('#id_penerima').val(result.message.id_penerima);
					jQuery('#nobukti').val(result.message.nobukti);
					jQuery('#tgbukti').val(result.message.tgbukti);
					jQuery('#uraian').val(result.message.uraian);
					jQuery('#notrans').val(result.message.notrans);
					
					jQuery('#tabel-rincian').html('');
					jQuery.each(result.akun, function(x,row){
						jQuery('#tabel-rincian').append(
							'<tr id="tr-'+x+'">'+
								'<td>'+
									'<input style="width:100px !important;" type="text" name="rincian['+x+'][\'kdakun\']" value="'+row.kdakun+'" readonly>'+
								'</td>'+
								'<td>'+
									row.nmakun+
								'</td>'+
								'<td><input style="width:50px !important;" type="text" name="rincian['+x+'][\'kddk\']" value="'+row.kddk+'" readonly></td>'+
								'<td><input style="text-align:right;width:150px !important;" class="val_num" type="text" name="rincian['+x+'][\'nilai\']" value="'+digit_grouping(row.nilai)+'"></td>'+
							'</tr>'
						);
						jQuery('#chosen'+x).val(row.kdakun);
						jQuery('#kddk-'+x).val(row.kddk);
						jQuery('.val_num').mask('000,000,000,000,000', {reverse: true});
					});
					
					jQuery('.chosen').trigger('change');
				}
				else{
					alertify.log(result.message);
				}
			});
		}
		
		//klik ubah
		jQuery('body').off('click', '.ubah').on('click', '.ubah', function(){
			var id = this.id;
			jQuery('#div-tabel').hide();
			jQuery('#div-form').show();
			cari_data(id);
		});
		
		//klik batal
		jQuery('.batal').click(function(){
			form_default();
		});
		
		//klik simpan
		jQuery('#simpan').click(function(){
			jQuery(this).html('<span class="loading"><i class="fa fa-refresh"></i> Loading.....</span>');
			jQuery(this).prop('disabled',true);
			var next = form_valid('id_alur,id_output,id_giat,id_penerima,kdtran,notrans,nobukti,tgbukti,uraian');
			if(next==true){
				jQuery.get('token', function(token){
					if(token){
						jQuery('#_token').val(token);
						var data = jQuery('#form-ruh').serialize();
						jQuery.ajax({
							url: 'transaksi/rekam',
							method: 'POST',
							data: data,
							success: function(result){
								if(result=='success') {
									jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									jQuery('#simpan').prop('disabled',false);
									alertify.log('Proses simpan berhasil');
									form_default();
									table.ajax.reload();
								} else {
									jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									jQuery('#simpan').prop('disabled',false);
									alertify.log(result);
								} 
							},
							error: function(result){
								jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								jQuery('#simpan').prop('disabled',false);
								alertify.log('Data tidak dapat disimpan. Koneksi pada aplikasi/database terputus atau data sudah pernah direkam atau format data salah. Hubungi Administrator.');
							}
						})
					} 
					else{
						jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						jQuery('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
			}
			else{
				jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
				jQuery('#simpan').prop('disabled',false);
				alertify.log('Data tidak dapat dikosongkan!');
			}
		});
		
		//hapus
		jQuery('body').off('click', '.hapus').on('click', '.hapus', function(){
			var id = this.id;
			alertify.confirm('Hapus data ini?', function(c){
				if(c) {
					jQuery.get('token', function(token){
						if(token) {
							jQuery.ajax({
								url:'transaksi/rekam/hapus',
								method:'POST',
								data:{
									_token:token, 
									id:id
								},
								success:function(result){
									if(result=='success') {
										alertify.log('Proses hapus berhasil.');
										table.ajax.reload();
									} else {
										alertify.log(result);
									}
								},
								error:function(result){
									alertify.log('Koneksi pada aplikasi/database terputus. Hubungi Administrator.');
								}
							});
						} else {
							alertify.log('Proses hapus gagal. Silahkan refresh halaman browser anda.');
						} 
					});
				} 
			});
		});
		
	});
	
</script>
