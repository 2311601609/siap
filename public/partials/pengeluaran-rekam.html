<script>
	$(document).ready(function(){

		var route = 'pengeluaran/rekam';
		
		function numberWithCommas(x) {
			return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
		}
		
		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}
		
		function cariNourut(){
			$.get('dropdown/nourut/4', function(result){
				$('#nourut').val(result);
			});
			$.get('dropdown/tanggal', function(result){
				$('#tgrekam').val(result);
			});
		}
	
		$.fn.dataTable.ext.errMode = 'none';
		
		$('.uang').inputmask('numeric', {
			radixPoint: '.',
			groupSeparator: ',',
			autoGroup: true,
			prefix: '',
			rightAlign: false,
			digits: 2,
			oncleared: function () {
				// Fungsi ini akan dipanggil saat input dihapus
				$(this).val('');
			}
		});
		
		//aktivasi chosen
		$('.chosen').select2();
		
		$.get('dropdown/sdana', function(result){
			$('#kdsdana').html(result).trigger('change');
		});
		
		$.get('dropdown/proyek', function(result){
			$('#id_proyek').html(result).trigger('change');
		});
		
		$.get('dropdown/alur-pengeluaran', function(result){
			$('#id_alur').html(result).trigger('change');
		});
		
		$.get('dropdown/penerima', function(result){
			$('#id_pelanggan').html(result).trigger('change');
		});
		
		/*$.get('dropdown/transaksi', function(result){
			$('#kdtran').html(result).trigger('change');
		});*/
		
		$.get('dropdown/trans-dtl', function(result){
			$('#kdtran_dtl').html(result).trigger('change');
		});
		
		$.get('dropdown/output', function(result){
			$('#id_output').html(result).trigger('change');
		});

		$.get('dropdown/program', function(result){
			$('#id_program').html(result).trigger('change');
		});

		$('#id_program').on('select2:select', function(){
			var arr_program = $(this).val().split('|');
			var id_program = 0;
			if(arr_program.length>1){
				id_program = arr_program[0];
			}
			$.get('dropdown/kegiatan?id_program=' + id_program, function(result){
				$('#id_giat').html(result).trigger('change');
			});
		});

		$.get('dropdown/kontrak?tipe=2', function(result){
			$('#id_kontrak').html(result).trigger('change');
			$('#id_kontrak_dtl').html('').trigger('change');
		});

		$('body').off('select2:select', '#id_kontrak').on('select2:select', '#id_kontrak', function(){
			if($(this).val()){
				var id_kontrak = $(this).val();
				$('#id_kontrak_dtl').html('<option value="">Sedang proses...</option>').trigger('change');
				$.get('dropdown/kontrak-dtl?id_kontrak='+id_kontrak+'&update=0', function(result){
					$('#id_kontrak_dtl').html(result).trigger('change');
				});
			}
		});
		
		$.get(route, function(result){
			if(result=='1'){ //admin
				$('#tambah').show();
			}
		});
		
		$('#id_alur').on('select2:select', function(){
			var id_alur = $(this).val();
			$('#kdtran').html('').trigger('change');
			$.get('dropdown/transaksi/'+id_alur, function(result){
				$('#kdtran').html(result).trigger('change');
			});
		});
		
		$('#kdtran').on('select2:select', function(){
			var kdtran = $(this).val();
			$('#id_pelanggan,#kredit').prop('disabled', false).trigger('change');
			$('#debet,#kredit,#parent_id').html('').trigger('change');
			$.get('dropdown/akun/debet/'+kdtran, function(result){
				$('#debet').html(result).trigger('change');
			});
			$.get('dropdown/akun/kredit/'+kdtran, function(result){
				$('#kredit').html(result).trigger('change');
				$('#kredit').val('211100').trigger('change');
			});
			$.getJSON('dropdown/akun/debet/'+kdtran+'/json-unit', function(result){
				
				var akun='<option value="" style="display:none;">Pilih Akun</option>';
				$.each(result, function(i,field){
					akun+='<option value="'+field.kdakun+'">'+field.kdakun+' - '+field.nmakun+'</option>';
				});
				
				$('#inp-akun-debet').val(akun);
				
				$('#x1').val(0);
			
				$('#tabel-rincian1').html(
					'<tr id="tr1-0">'+
						'<td>'+
							'<select id="chosen1-0" class="form-control akun" name="rincian1[0][\'kdakun\']" style="z-index:999999999 !important;">'+
								$('#inp-akun-debet').val()+
							'</select>'+
						'</td>'+
						'<td><input id="nilai1-0" style="text-align:right;" type="text" name="rincian1[0][\'nilai\']" class="uang"></td>'+
						'<td>'+
							'<center><a href="javascript:;" id="0" class="btn btn-sm btn-danger hapus-detil1"><i class="fa fa-minus"></i></a></center>'+
						'</td>'+
					'</tr>'
				);
				
				$('#chosen1-0').select2();
				$('#nilai1-0').inputmask('numeric', {
					radixPoint: '.',
					groupSeparator: ',',
					autoGroup: true,
					prefix: '',
					rightAlign: false,
					digits: 2,
					oncleared: function () {
						// Fungsi ini akan dipanggil saat input dihapus
						$(this).val('');
					}
				});
				$('#x1').val(0);
				
			});
			$.getJSON('pengeluaran/rekam/tagihan/'+kdtran, function(result){
				if(result.error==false){
					$('#parent_id').html(result.dropdown).trigger('change');
					$('#div-tagihan').show();
				}
				else{
					$('#parent_id').html('').trigger('change');
					$('#div-tagihan').hide();
				}
			});
			$.getJSON('dropdown/akun-pajak-baru/json?id_trans='+kdtran, function(result){
				var akun='<option value="" style="display:none;">Pilih Akun</option>';
				$.each(result, function(i,field){
					akun+='<option value="'+field.kdakun+'|'+field.kddk+'|'+field.nilai+'">'+field.kdakun+' - '+field.nmakun+' ('+field.kddk+')</option>';
				});
				$('#inp-akun').val(akun);
			});
		});
		
		//tampilan default
		function form_default() {
			$('input,select,textarea').val('');
			$('.warning, #div-form, #div-tagihan, #div-form-detil, #cari-nourut').hide();
			$('#div-tabel').show();
			$('.chosen').prop('disabled', false).trigger('change');
			$('#simpan').prop('disabled', false);
			$('#tabel-rincian').html('');
			$.get('dropdown/ttd/05', function(result){
				$('#ttd1').html(result).trigger('change');
			});
			
			$.get('dropdown/ttd/04', function(result){
				$('#ttd2').html(result).trigger('change');
			});
			
			$.get('dropdown/ttd/02', function(result){
				$('#ttd3').html(result).trigger('change');
			});
			
			$.get('dropdown/ttd/01', function(result){
				$('#ttd4').html(result).trigger('change');
			});
		}
		
		//aktivasi tampilan default
		form_default();
		
		//klik tambah
		$('#tambah').click(function(){
			$('#div-tabel').hide();
			$('#inp-rekambaru').val('1');
			$('#div-form,#cari-nourut').show();
			$('#nilai,#ppn,#total,#pajak,#pagu,#realisasi,#sisa,#pph21,#pph22,#pph23,#pph25').val(0);
			cariNourut();
			
			$.get('dropdown/tanggal', function(result){
				$('#tgpks').val(result);
			});
			
		});
		
		$('#tambah-detil').click(function(){
			var x=parseInt($('#x').val() || 0)+1;
			$('#tabel-rincian').append(
				'<tr id="tr-'+x+'">'+
					'<td>'+
						'<select id="chosen-'+x+'" class="form-control chosen akun" name="rincian['+x+'][\'kdakun\']" style="z-index:999999999 !important;">'+
							$('#inp-akun').val()+
						'</select>'+
					'</td>'+
					'<td><input id="nilai-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="uang"></td>'+
					'<td>'+
						'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
					'</td>'+
				'</tr>'
			);
			$('#chosen-'+x).select2();
			$('#nilai-'+x).inputmask('numeric', {
				radixPoint: '.',
				groupSeparator: ',',
				autoGroup: true,
				prefix: '',
				rightAlign: false,
				digits: 2,
				oncleared: function () {
					// Fungsi ini akan dipanggil saat input dihapus
					$(this).val('');
				}
			});
			$('#x').val(x);
		});
		
		$('#tambah-detil1').click(function(){
			var x=parseInt($('#x1').val())+1;
			$('#tabel-rincian1').append(
				'<tr id="tr1-'+x+'">'+
					'<td>'+
						'<select id="chosen1-'+x+'" class="form-control akun1" name="rincian1['+x+'][\'kdakun\']" style="z-index:999999997 !important;">'+
							$('#inp-akun-debet').val()+

		//validasi isian form
		function form_valid(str_id){
			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if($('#'+arr_id[x]).val()==''){
					$('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
