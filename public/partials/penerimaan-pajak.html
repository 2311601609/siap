<script>
	$(document).ready(function(){

		var route = 'penerimaan/pajak';
	
		$.fn.dataTable.ext.errMode = 'none';
			
		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}
		
		function numberWithCommas(x) {
			return x.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
		}
		
		$('.uang').inputmask('numeric', {
			radixPoint: '.',
			groupSeparator: ',',
			autoGroup: true,
			prefix: '',
			rightAlign: false,
			digits: 2,
			oncleared: function () {
				// Fungsi ini akan dipanggil saat input dihapus
				$(this).val('');
			}
		});
		
		//aktivasi chosen
		$('.chosen').select2();
		
		//tampilan default
		function form_default() {
			$('input,textarea,select').val('');
			$('.warning, #div-form').hide();
			$('#div-tabel').show();
			$('.chosen').trigger('change');
			$('#simpan').prop('disabled', false);
		}
		
		//aktivasi tampilan default
		form_default();

		// datatable init
        $("#exportPrint").on("click", function () {
            table.button('.buttons-print').trigger();
        });

		$("#exportPdf").on("click", function () {
            table.button('.buttons-pdf').trigger();
        });

		$("#exportExcel").on("click", function () {
            table.button('.buttons-excel').trigger();
        });

		//data tabel
		var table = $('#tabel-ruh').DataTable({
			buttons: [
                {
                    extend: 'print',
                    title: 'Pajak Penerimaan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
                {
                    extend: 'pdf',
                    title: 'Pajak Penerimaan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
				{
                    extend: 'excel',
					title: 'Pajak Penerimaan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
            ],
            lengthMenu: [
                [10, 25, 50, 100, -1],
                [10, 25, 50, 100, "Semua"],
            ],
			processing: true,
			language:{
			    "decimal":        "",
			    "emptyTable":     "Tidak ada data tersedia",
			    "info":           "Menampilkan _START_ sampai _END_ dari _TOTAL_ entri",
			    "infoEmpty":      "Menampilkan 0 sampai 0 dari 0 entri",
			    "infoFiltered":   "(disaring dari _MAX_ total entri)",
			    "infoPostFix":    "",
			    "thousands":      ",",
			    "lengthMenu":     "Tampilkan _MENU_ entri",
			    "loadingRecords": "Proses Loading...",
			    "processing":     "Sedang Proses...",
			    "search":         "Cari:",
			    "zeroRecords":    "Tidak ditemukan data yang sesuai",
			    "paginate": {
			        "first":      "Awal",
			        "last":       "Akhir",
			        "next":       "Sesudah",
			        "previous":   "Sebelum"
			    },
			    "aria": {
			        "sortAscending":  ": aktifkan untuk mengurutkan kolom (asc)",
			        "sortDescending": ": aktifkan untuk mengurutkan kolom (desc)"
			    }
			},
			serverSide: true,
			ajax: {
				url: route,
			},
			columns: [
				{ data: "DT_RowIndex", name: "DT_RowIndex", className: "t-center", orderable: false, searchable: false },
				{ data: "nourut", name: "nourut", className: "t-left" },
				{ data: "nmunit", name: "nmunit", className: "t-left" },
				{ data: "nama", name: "nama", className: "t-left" },
				{ data: "nmtrans", name: "nmtrans", className: "t-left" },
				{ data: "nilai", name: "nilai", className: "t-right" },
				{ data: "pajak", name: "pajak", className: "t-right" },
				{ data: "total", name: "total", className: "t-right" },
				{ data: "aksi", name: "aksi", className: "t-center", orderable: false, searchable: false },
			],
		});
		
		//validasi isian form
		function form_valid(str_id){
			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if($('#'+arr_id[x]).val()==''){
					$('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
		
		//cari data user yang akan di edit berdasarkan id user
		function cari_data(id){
			$('.chosen').val('').trigger('change');
			$.getJSON(route + '/pilih/' + id, function(result){
				if(result.error==false) {
					$('#inp-id').val(id);
					$('#inp-rekambaru').val('0');
					$('#x').val(result.x);
					
					$('#tabel-rincian').html('');

					$.getJSON('dropdown/akun-pajak-baru/json?id_trans=' + result.message.kdtran, function(result1){
					
						var akun='<option value="" style="display:none;">Pilih Akun</option>';
						$.each(result1, function(i,field){
							akun+='<option value="'+field.kdakun+'|'+field.kddk+'|'+field.nilai+'">'+field.kdakun+' - '+field.nmakun+' ('+field.kddk+')</option>';
						});

						$('#inp-akun').val(akun);

						$.each(result.akun, function(x,row){

							$('#tabel-rincian').append(
								'<tr id="tr-'+x+'">'+
									'<td>'+
										'<select id="chosen-'+x+'" class="form-control akun" name="rincian['+x+'][\'kdakun\']" style="z-index:999999999 !important;">'+
											$('#inp-akun').val()+
										'</select>'+
									'</td>'+
									'<td><input id="nilai-'+x+'" type="text" name="rincian['+x+'][\'nilai\']" class="uang" value="'+row.nilai+'"></td>'+
									'<td>'+
										'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
									'</td>'+
								'</tr>'
							);

							$('#nilai-'+x).inputmask('numeric', {
								radixPoint: '.',
								groupSeparator: ',',
								autoGroup: true,
								prefix: '',
								rightAlign: true,
								digits: 2,
								oncleared: function () {
									// Fungsi ini akan dipanggil saat input dihapus
									$(this).val('');
								}
							});

							$('#chosen-'+x).select2({width:'100%', search_contains: true});
							$('#chosen-'+x).val(row.kdakun+'|'+row.kddk+'|'+row.nilai1).trigger('change');
							
						});

					});
					
					$('#nmunit').val(result.message.nmunit);
					$('#id_alur').val(result.message.id_alur);
					$('#nourut').val(result.message.nourut);
					$('#status').val(result.message.status);
					$('#nmunit').val(result.message.nmunit);
					$('#nmalur').val(result.message.nmalur);
					$('#debet').val(result.message.debet);
					$('#kredit').val(result.message.kredit);
					$('#kdakun_d').val(result.message.kdakun_d);
					$('#kdakun_k').val(result.message.kdakun_k);
					$('#nmtrans').val(result.message.nmtrans);
					$('#nmpelanggan').val(result.message.nmpelanggan);
					$('#nopks').val(result.message.nopks);
					$('#tgpks').val(result.message.tgpks);
					$('#tgjtempo').val(result.message.tgjtempo);
					$('#uraian').val(result.message.uraian);
					$('#nilai').val(digit_grouping(result.message.nilai));
					$('#total').val(digit_grouping(result.message.total));
					$('#div-lampiran').html(result.lampiran);
					$('#pajak').html(result.pajak).trigger('change');
					$('.chosen').trigger('change');
					
				}
				else{
					alertify.log(result.message);
				}
			});
		}
		
		$('#tambah-detil').click(function(){
			var x=parseInt($('#x').val())+1;
			$('#tabel-rincian').append(
				'<tr id="tr-'+x+'">'+
					'<td>'+
						'<select id="chosen-'+x+'" class="form-control akun" name="rincian['+x+'][\'kdakun\']" style="z-index:999999999 !important;">'+
							$('#inp-akun').val()+
						'</select>'+
					'</td>'+
					'<td><input id="nilai-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="val_num"></td>'+
					'<td>'+
						'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
					'</td>'+
				'</tr>'
			);
			$('#chosen-'+x).select2();
			$('#nilai-'+x).inputmask('numeric', {
				radixPoint: '.',
				groupSeparator: ',',
				autoGroup: true,
				prefix: '',
				rightAlign: false,
				digits: 2,
				oncleared: function () {
					// Fungsi ini akan dipanggil saat input dihapus
					$(this).val('');
				}
			});
			$('#x').val(x);
		});
		
		$('body').off('click', '.hapus-detil').on('click', '.hapus-detil', function(){
			var id=this.id;
			$('#tr-'+id).remove();
		});
		
		//klik ubah
		$('body').off('click', '.proses').on('click', '.proses', function(){
			var id = this.id;
			$('#div-tabel').hide();
			$('#div-form').show();
			cari_data(id);
		});
		
		//klik batal
		$('.batal').click(function(){
			form_default();
		});
		
		//klik simpan
		$('#simpan').click(function(){
			$(this).html('<span class="loading"><i class="fa fa-refresh"></i> Loading.....</span>');
			$(this).prop('disabled',true);
			var next = form_valid('inp-id,pajak,nilai1');
			if(next==true){
				$.get('token', function(token){
					if(token){
						$('#_token').val(token);
						var data = $('#form-ruh').serialize();
						$.ajax({
							url: route,
							method: 'POST',
							data: data,
							success: function(result){
								if(result=='success') {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log('Proses simpan berhasil');
									form_default();
									table.ajax.reload();
								} else {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log(result);
								} 
							},
							error: function(result){
								$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								$('#simpan').prop('disabled',false);
								alertify.log('Data tidak dapat disimpan. Koneksi pada aplikasi/database terputus atau data sudah pernah direkam atau format data salah. Hubungi Administrator.');
							}
						})
					} 
					else{
						$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						$('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
			}
			else{
				$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
				$('#simpan').prop('disabled',false);
				alertify.log('Data tidak dapat dikosongkan!');
			}
		});
		
		$('#hitung-total').click(function(){
			var next = form_valid('nilai');
			if(next==true){
				$.get('token', function(token){
					if(token){
						$('#_token').val(token);
						var data = $('#form-ruh').serialize();
						$.ajax({
							url: 'penerimaan/rekam/hitung-total?param=2',
							method: 'POST',
							data: data,
							success: function(result){
								$('#total').val(result);
							},
							error: function(result){
								$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								$('#simpan').prop('disabled',false);
								alertify.log('Koneksi pada aplikasi/database terputus!');
							}
						})
					}
					else{
						$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						$('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
			}
			else{
				$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
				$('#simpan').prop('disabled',false);
				alertify.log('Data tidak dapat dikosongkan!');
			}
		});
		
	});
	
</script>
