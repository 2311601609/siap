<script>
	$(document).ready(function(){

		$.fn.dataTable.ext.errMode = 'none';

		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}

		//data tabel
		var table=$('#tabel-ruh').DataTable({
			buttons: [
				{
					extend: 'excel',
					title: 'Neraca Percobaan'
				},
				{
					extend: 'pdf',
					title: 'Neraca Percobaan'
				},
				{
					extend: 'print',
					title: 'Neraca Percobaan'
				}
			],
			processing: true,
			lengthMenu: [
                [10, 25, 50, 100, -1],
                [10, 25, 50, 100, "Semua"],
            ],
			language:{
			    "decimal":        "",
			    "emptyTable":     "Tidak ada data tersedia",
			    "info":           "Menampilkan _START_ sampai _END_ dari _TOTAL_ entri",
			    "infoEmpty":      "Menampilkan 0 sampai 0 dari 0 entri",
			    "infoFiltered":   "(disaring dari _MAX_ total entri)",
			    "infoPostFix":    "",
			    "thousands":      ",",
			    "lengthMenu":     "Tampilkan _MENU_ entri",
			    "loadingRecords": "Proses Loading...",
			    "processing":     "Sedang Proses...",
			    "search":         "Cari:",
			    "zeroRecords":    "Tidak ditemukan data yang sesuai",
			    "paginate": {
			        "first":      "Awal",
			        "last":       "Akhir",
			        "next":       "Sesudah",
			        "previous":   "Sebelum"
			    },
			    "aria": {
			        "sortAscending":  ": aktifkan untuk mengurutkan kolom (asc)",
			        "sortDescending": ": aktifkan untuk mengurutkan kolom (desc)"
			    }
			},
			ajax: {
				url: 'pembukuan/neraca-percobaan',
			},
			columns: [
				{ data: "kdakun", name: "kdakun", className: "t-left" },
				{ data: "nmakun", name: "nmakun", className: "t-left" },
				{ data: "debet", name: "debet", className: "t-right" },
				{ data: "kredit", name: "kredit", className: "t-right" },
			],
		});
		
		$('#cari').click(function(){
			
			$('#div-tabel').show();
			
			var tgawal = '';
			if($('#tgawal').val()!==''){
				tgawal = $('#tgawal').val();
			}
			var tgakhir = '';
			if($('#tgakhir').val()!==''){
				tgakhir = $('#tgakhir').val();
			}
			
			table.ajax.url('pembukuan/neraca-percobaan?tgawal='+tgawal+'&tgakhir='+tgakhir).load();

			$.getJSON('pembukuan/neraca-percobaan/total?tgawal='+tgawal+'&tgakhir='+tgakhir, function(result){
				if(result){
					$('#total-debet').html(digit_grouping(result.debet));
					$('#total-kredit').html(digit_grouping(result.kredit));
				}
			});
		
		});
		
		$('#download').click(function(){
			
			var tgawal = 'xxx';
			if($('#tgawal').val()!==''){
				tgawal = $('#tgawal').val();
			}
			var tgakhir = 'xxx';
			if($('#tgakhir').val()!==''){
				tgakhir = $('#tgakhir').val();
			}
			
			window.open('pembukuan/jurnal/'+tgawal+'/'+tgakhir+'/excel', '_blank');
		
		});
		
	});
</script>
