<script>
	jQuery(document).ready(function(){

		var route = 'tagihan/pajak';
	
		jQuery.fn.dataTable.ext.errMode = 'none';
			
		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}

		$('.uang').inputmask('numeric', {
			radixPoint: '.',
			groupSeparator: ',',
			autoGroup: true,
			prefix: '',
			rightAlign: false,
			digits: 2,
			oncleared: function () {
				// Fungsi ini akan dipanggil saat input dihapus
				$(this).val('');
			}
		});
		
		//aktivasi chosen
		jQuery('.chosen').select2();
		
		//tampilan default
		function form_default() {
			jQuery('input,textarea,select').val('');
			jQuery('.warning, #div-form').hide();
			jQuery('#div-tabel').show();
			jQuery('.chosen').trigger('change');
			jQuery('#simpan').prop('disabled', false);
			jQuery.getJSON('dropdown/akun-pajak-baru/json', function(result){
				var akun='<option value="" style="display:none;">Pilih Akun</option>';
				jQuery.each(result, function(i,field){
					akun+='<option value="'+field.kdakun+'|'+field.kddk+'|'+field.nilai+'">'+field.kdakun+' - '+field.nmakun+'</option>';
				});
				jQuery('#inp-akun').val(akun);
			});
		}
		
		//aktivasi tampilan default
		form_default();
		
		// datatable init
        $("#exportPrint").on("click", function () {
            table.button('.buttons-print').trigger();
        });

		$("#exportPdf").on("click", function () {
            table.button('.buttons-pdf').trigger();
        });

		$("#exportExcel").on("click", function () {
            table.button('.buttons-excel').trigger();
        });

		//data tabel
		var table = $('#tabel-ruh').DataTable({
			buttons: [
                {
                    extend: 'print',
                    title: 'Pajak Tagihan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
                {
                    extend: 'pdf',
                    title: 'Pajak Tagihan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
				{
                    extend: 'excel',
					title: 'Pajak Tagihan',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
            ],
            lengthMenu: [
                [10, 25, 50, 100, -1],
                [10, 25, 50, 100, "Semua"],
            ],
			processing: true,
			language:{
			    "decimal":        "",
			    "emptyTable":     "Tidak ada data tersedia",
			    "info":           "Menampilkan _START_ sampai _END_ dari _TOTAL_ entri",
			    "infoEmpty":      "Menampilkan 0 sampai 0 dari 0 entri",
			    "infoFiltered":   "(disaring dari _MAX_ total entri)",
			    "infoPostFix":    "",
			    "thousands":      ",",
			    "lengthMenu":     "Tampilkan _MENU_ entri",
			    "loadingRecords": "Proses Loading...",
			    "processing":     "Sedang Proses...",
			    "search":         "Cari:",
			    "zeroRecords":    "Tidak ditemukan data yang sesuai",
			    "paginate": {
			        "first":      "Awal",
			        "last":       "Akhir",
			        "next":       "Sesudah",
			        "previous":   "Sebelum"
			    },
			    "aria": {
			        "sortAscending":  ": aktifkan untuk mengurutkan kolom (asc)",
			        "sortDescending": ": aktifkan untuk mengurutkan kolom (desc)"
			    }
			},
			serverSide: true,
			ajax: {
				url: route,
			},
			columns: [
				{ data: "DT_RowIndex", name: "DT_RowIndex", className: "t-center", orderable: false, searchable: false },
				{ data: "nourut", name: "nourut", className: "t-left" },
				{ data: "nmunit", name: "nmunit", className: "t-left" },
				{ data: "nama", name: "nama", className: "t-left" },
				{ data: "nmtrans", name: "nmtrans", className: "t-left" },
				{ data: "nilai", name: "nilai", className: "t-right" },
				{ data: "pajak", name: "pajak", className: "t-right" },
				{ data: "total", name: "total", className: "t-right" },
				{ data: "aksi", name: "aksi", className: "t-center", orderable: false, searchable: false },
			],
		});
		
		//validasi isian form
		function form_valid(str_id){
			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if(jQuery('#'+arr_id[x]).val()==''){
					jQuery('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
		
		//cari data user yang akan di edit berdasarkan id user
		function cari_data(id){
			jQuery('.chosen').val('').trigger('change');
			jQuery.getJSON('tagihan/pajak/pilih/'+id, function(result){
				if(result.error==false) {
					jQuery('#inp-id').val(id);
					jQuery('#inp-rekambaru').val('0');
					jQuery('#x').val(result.x);
					
					jQuery('#tabel-rincian').html('');
					jQuery.each(result.akun, function(x,row){
						jQuery('#tabel-rincian').append(
							'<tr id="tr-'+x+'">'+
								'<td>'+
									'<select id="chosen-'+x+'" class="form-control akun" name="rincian['+x+'][\'kdakun\']" style="z-index:999999999 !important;">'+
										jQuery('#inp-akun').val()+
									'</select>'+
								'</td>'+
								'<td><input id="nilai-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="uang" value="'+digit_grouping(row.nilai)+'"></td>'+
								'<td>'+
									'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
								'</td>'+
							'</tr>'
						);
						jQuery('#chosen-'+x).val(row.kdakun+'|'+row.kddk+'|'+row.nilai1);
						jQuery('#chosen-'+x).select2();

						$('#nilai-'+x).inputmask('numeric', {
							radixPoint: '.',
							groupSeparator: ',',
							autoGroup: true,
							prefix: '',
							rightAlign: false,
							digits: 2,
							oncleared: function () {
								// Fungsi ini akan dipanggil saat input dihapus
								$(this).val('');
							}
						});
						
					});
					
					jQuery('#nmunit').val(result.message.nmunit);
					jQuery('#id_alur').val(result.message.id_alur);
					jQuery('#nourut').val(result.message.nourut);
					jQuery('#status').val(result.message.status);
					jQuery('#nmunit').val(result.message.nmunit);
					jQuery('#nmalur').val(result.message.nmalur);
					jQuery('#debet').val(result.message.debet);
					jQuery('#kredit').val(result.message.kredit);
					jQuery('#kdakun_d').val(result.message.kdakun_d);
					jQuery('#kdakun_k').val(result.message.kdakun_k);
					jQuery('#nmtrans').val(result.message.nmtrans);
					jQuery('#nmpelanggan').val(result.message.nmpelanggan);
					jQuery('#nopks').val(result.message.nopks);
					jQuery('#tgpks').val(result.message.tgpks);
					jQuery('#tgjtempo').val(result.message.tgjtempo);
					jQuery('#uraian').val(result.message.uraian);
					jQuery('#nilai').val(digit_grouping(result.message.nilai));
					jQuery('#ppn').val(digit_grouping(result.message.ppn));
					jQuery('#pph21').val(digit_grouping(result.message.pph21));
					jQuery('#pph22').val(digit_grouping(result.message.pph22));
					jQuery('#pph23').val(digit_grouping(result.message.pph23));
					jQuery('#pph25').val(digit_grouping(result.message.pph25));
					jQuery('#total').val(digit_grouping(result.message.total));
					jQuery('#div-lampiran').html(result.lampiran);
					jQuery('#pajak').html(result.pajak).trigger('change');
					jQuery('.chosen').trigger('change');
					
				}
				else{
					alertify.log(result.message);
				}
			});
		}
		
		jQuery('#tambah-detil').click(function(){
			var x=parseInt(jQuery('#x').val())+1;
			jQuery('#tabel-rincian').append(
				'<tr id="tr-'+x+'">'+
					'<td>'+
						'<select id="chosen-'+x+'" class="form-control akun" name="rincian['+x+'][\'kdakun\']" style="z-index:999999999 !important;">'+
							jQuery('#inp-akun').val()+
						'</select>'+
					'</td>'+
					'<td><input id="nilai-'+x+'" style="text-align:right;" type="text" name="rincian['+x+'][\'nilai\']" class="val_num"></td>'+
					'<td>'+
						'<center><a href="javascript:;" id="'+x+'" class="btn btn-sm btn-danger hapus-detil"><i class="fa fa-minus"></i></a></center>'+
					'</td>'+
				'</tr>'
			);
			jQuery('#chosen-'+x).select2();
			$('#nilai-'+x).inputmask('numeric', {
				radixPoint: '.',
				groupSeparator: ',',
				autoGroup: true,
				prefix: '',
				rightAlign: false,
				digits: 2,
				oncleared: function () {
					// Fungsi ini akan dipanggil saat input dihapus
					$(this).val('');
				}
			});
			jQuery('#x').val(x);
		});
		
		jQuery('body').off('click', '.hapus-detil').on('click', '.hapus-detil', function(){
			var id=this.id;
			jQuery('#tr-'+id).remove();
		});
		
		//klik ubah
		jQuery('body').off('click', '.proses').on('click', '.proses', function(){
			var id = this.id;
			jQuery('#div-tabel').hide();
			jQuery('#div-form').show();
			cari_data(id);
		});
		
		//klik batal
		jQuery('.batal').click(function(){
			form_default();
		});
		
		//klik simpan
		jQuery('#simpan').click(function(){
			jQuery(this).html('<span class="loading"><i class="fa fa-refresh"></i> Loading.....</span>');
			jQuery(this).prop('disabled',true);
			var next = form_valid('inp-id,pajak,nilai1');
			if(next==true){
				jQuery.get('token', function(token){
					if(token){
						jQuery('#_token').val(token);
						var data = jQuery('#form-ruh').serialize();
						jQuery.ajax({
							url: 'tagihan/pajak',
							method: 'POST',
							data: data,
							success: function(result){
								if(result=='success') {
									jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									jQuery('#simpan').prop('disabled',false);
									alertify.log('Proses simpan berhasil');
									form_default();
									table.ajax.reload();
								} else {
									jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									jQuery('#simpan').prop('disabled',false);
									alertify.log(result);
								} 
							},
							error: function(result){
								jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								jQuery('#simpan').prop('disabled',false);
								alertify.log('Data tidak dapat disimpan. Koneksi pada aplikasi/database terputus atau data sudah pernah direkam atau format data salah. Hubungi Administrator.');
							}
						})
					} 
					else{
						jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						jQuery('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
			}
			else{
				jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
				jQuery('#simpan').prop('disabled',false);
				alertify.log('Data tidak dapat dikosongkan!');
			}
		});
		
		jQuery('body').off('click', '.hapus-pajak').on('click', '.hapus-pajak', function(){
			var id = this.id;
			alertify.confirm('Hapus pajak ini?', function(c){
				if(c) {
					jQuery.get('token', function(token){
						if(token) {
							jQuery.ajax({
								url:'tagihan/pajak/hapus',
								method:'POST',
								data:{
									_token:token, 
									id:id
								},
								success:function(result){
									if(result=='success') {
										alertify.log('Proses hapus berhasil.');
										table.ajax.reload();
									} else {
										alertify.log(result);
									}
								},
								error:function(result){
									alertify.log('Koneksi pada aplikasi/database terputus. Hubungi Administrator.');
								}
							});
						} else {
							alertify.log('Proses hapus gagal. Silahkan refresh halaman browser anda.');
						} 
					});
				} 
			});
		});
		
		jQuery('#hitung-total').click(function(){
			var next = form_valid('nilai');
			if(next==true){
				jQuery.get('token', function(token){
					if(token){
						jQuery('#_token').val(token);
						var data = jQuery('#form-ruh').serialize();
						jQuery.ajax({
							url: 'penerimaan/rekam/hitung-total?param=1',
							method: 'POST',
							data: data,
							success: function(result){
								jQuery('#total').val(result);
							},
							error: function(result){
								jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								jQuery('#simpan').prop('disabled',false);
								alertify.log('Koneksi pada aplikasi/database terputus!');
							}
						})
					}
					else{
						jQuery('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						jQuery('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
