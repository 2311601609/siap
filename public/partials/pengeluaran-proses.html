<script>
	$(document).ready(function(){

		var route = 'pengeluaran/proses';
	
		$.fn.dataTable.ext.errMode = 'none';
			
		function digit_grouping(nStr){
			nStr += '';
			x = nStr.split('.');
			x1 = x[0];
			x2 = x.length > 1 ? '.' + x[1] : '';
			var rgx = /(\d+)(\d{3})/;
			while (rgx.test(x1)) {
				x1 = x1.replace(rgx, '$1' + ',' + '$2');
			}
			return x1 + x2;
		}
		
		//aktivasi chosen
		$('.chosen').select2();
		
		//tampilan default
		function form_default() {
			$('input,textarea,select').val('');
			$('.warning, #div-form').hide();
			$('#div-tabel').show();
			$('.chosen').trigger('change');
			$('#simpan').prop('disabled', false);
		}
		
		//aktivasi tampilan default
		form_default();
		
		function getParameterByName(name, url) {
			if (!url) url = window.location.href;
			name = name.replace(/[\[\]]/g, '\\$&');
			var regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)'),
				results = regex.exec(url);
			if (!results) return null;
			if (!results[2]) return '';
			return decodeURIComponent(results[2].replace(/\+/g, ' '));
		}
		
		if(getParameterByName('id_trans')){
			var id_trans = getParameterByName('id_trans');
		}
		else{
			var id_trans = '';
		}
		
		// datatable init
        $("#exportPrint").on("click", function () {
            table.button('.buttons-print').trigger();
        });

		$("#exportPdf").on("click", function () {
            table.button('.buttons-pdf').trigger();
        });

		$("#exportExcel").on("click", function () {
            table.button('.buttons-excel').trigger();
        });

		//data tabel
		var table = $('#tabel-ruh').DataTable({
			buttons: [
                {
                    extend: 'print',
                    title: 'Proses Pengeluaran',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
                {
                    extend: 'pdf',
                    title: 'Proses Pengeluaran',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
				{
                    extend: 'excel',
					title: 'Proses Pengeluaran',
                    exportOptions: {
                        columns: [ 0, 1, 2, 3, 4, 5, 6, 7 ]
                    },
                    orientation: 'landscape',
                    pageSize: 'LEGAL'
                },
            ],
            lengthMenu: [
                [10, 25, 50, 100, -1],
                [10, 25, 50, 100, "Semua"],
            ],
			processing: true,
			language:{
			    "decimal":        "",
			    "emptyTable":     "Tidak ada data tersedia",
			    "info":           "Menampilkan _START_ sampai _END_ dari _TOTAL_ entri",
			    "infoEmpty":      "Menampilkan 0 sampai 0 dari 0 entri",
			    "infoFiltered":   "(disaring dari _MAX_ total entri)",
			    "infoPostFix":    "",
			    "thousands":      ",",
			    "lengthMenu":     "Tampilkan _MENU_ entri",
			    "loadingRecords": "Proses Loading...",
			    "processing":     "Sedang Proses...",
			    "search":         "Cari:",
			    "zeroRecords":    "Tidak ditemukan data yang sesuai",
			    "paginate": {
			        "first":      "Awal",
			        "last":       "Akhir",
			        "next":       "Sesudah",
			        "previous":   "Sebelum"
			    },
			    "aria": {
			        "sortAscending":  ": aktifkan untuk mengurutkan kolom (asc)",
			        "sortDescending": ": aktifkan untuk mengurutkan kolom (desc)"
			    }
			},
			serverSide: true,
			ajax: {
				url: route,
			},
			columns: [
				{ data: "DT_RowIndex", name: "DT_RowIndex", className: "t-center", orderable: false, searchable: false },
				{ data: "nourut", name: "nourut", className: "t-left" },
				{ data: "nmunit", name: "nmunit", className: "t-left" },
				{ data: "nama", name: "nama", className: "t-left" },
				{ data: "nmtrans", name: "nmtrans", className: "t-left" },
				{ data: "pks", name: "pks", className: "t-left" },
				{ data: "nilai", name: "nilai", className: "t-right" },
				{ data: "status", name: "status", className: "t-left" },
				{ data: "aksi", name: "aksi", className: "t-center", orderable: false, searchable: false },
			],
		});
		
		//validasi isian form
		function form_valid(str_id){
			var arr_id = str_id.split(',');
			var next = true;
			for(x = 0; x < arr_id.length; x++){
				if($('#'+arr_id[x]).val()==''){
					$('#'+arr_id[x]).addClass('is-invalid');
					next = false;
				}
			}
			return next;
		}
		
		//cari data user yang akan di edit berdasarkan id user
		function cari_data(id){
			$('.chosen').val('').trigger('change');
			$.getJSON(route+'/pilih/'+id, function(result){
				if(result.error==false) {
					$('#inp-id').val(id);
					$('#inp-rekambaru').val('0');
					$('#nourut').val(result.message.nourut);
					$('#nmunit').val(result.message.nmunit);
					$('#id_alur').val(result.message.id_alur);
					$('#status').val(result.message.status);
					$('#nmsdana').val(result.message.nmsdana);
					$('#nmunit').val(result.message.nmunit);
					$('#nmalur').val(result.message.nmalur);
					$('#debet').val(result.message.debet);
					$('#kredit').val(result.message.kredit);
					$('#nmtrans').val(result.message.nmtrans);
					$('#nmtrans_dtl').val(result.message.nmtrans_dtl);
					$('#nmproyek').val(result.message.nmproyek);
					$('#nmpelanggan').val(result.message.nmpelanggan);
					$('#nopks').val(result.message.nopks);
					$('#tgpks').val(result.message.tgpks);
					$('#tgjtempo').val(result.message.tgjtempo);
					$('#tgrekam').val(result.message.tgrekam);
					$('#uraian').val(result.message.uraian);
					/*$('#pagu').val(digit_grouping(result.pagu));
					$('#realisasi').val(digit_grouping(result.realisasi));
					$('#sisa').val(digit_grouping(result.sisa));*/
					$('#nilai').val(digit_grouping(result.message.nilai));
					$('#pajak').val(digit_grouping(result.message.pajak));
					$('#total').val(digit_grouping(result.message.total));
					$('#status1').html(result.dropdown).trigger('change');
					$('#div-lampiran').html(result.lampiran);
					$('#div-rincian-akun').html(result.akun);
					$('#div-catatan').html(result.catatan);
					$('#div-pagu').html(result.tabel_pagu);
				}
				else{
					alertify.log(result.message);
				}
			});
		}
		
		//klik ubah
		$('body').off('click', '.proses').on('click', '.proses', function(){
			var id = this.id;
			$('#div-tabel').hide();
			$('#div-form').show();
			cari_data(id);
		});
		
		//klik batal
		$('.batal').click(function(){
			form_default();
		});
		
		//klik simpan
		$('#simpan').click(function(){
			$(this).html('<span class="loading"><i class="fa fa-refresh"></i> Loading.....</span>');
			$(this).prop('disabled',true);
			var next = form_valid('inp-id,id_alur,status,status1');
			if(next==true){
				$.get('token', function(token){
					if(token){
						$('#_token').val(token);
						var data = $('#form-ruh').serialize();
						$.ajax({
							url: route,
							method: 'POST',
							data: data,
							success: function(result){
								if(result=='success') {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log('Proses simpan berhasil');
									form_default();
									table.ajax.reload();
								} else {
									$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
									$('#simpan').prop('disabled',false);
									alertify.log(result);
								} 
							},
							error: function(result){
								$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
								$('#simpan').prop('disabled',false);
								alertify.log('Data tidak dapat disimpan. Koneksi pada aplikasi/database terputus atau data sudah pernah direkam atau format data salah. Hubungi Administrator.');
							}
						})
					} 
					else{
						$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
						$('#simpan').prop('disabled',false);
						alertify.log('Sesi telah habis, silahkan refresh browser Anda!');
					}
				});
			}
			else{
				$('#simpan').html('<i class="fa fa-check-square-o"></i> Simpan');
				$('#simpan').prop('disabled',false);
				alertify.log('Data tidak dapat dikosongkan!');
			}
		});
		
	});
	
</script>
