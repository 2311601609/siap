<!-- Prevent direct access to .html file -->
<script>
	if(typeof app === 'undefined'){
		document.location.href='index.php';
	}
</script>

<section>
	<div class="row">
		<div class="col-sm-12">
			<div class="content-header">Pembukuan/ Buku Besar</div>
		</div>
	</div>

	<div class="row" id="div-form">
		<div class="col-md-12">
			<div class="card">
				<div class="card-header">
					<h4 class="card-title" id="horz-layout-basic">Form</h4>
				</div>
				<div class="card-body">
					<div class="px-3">
						<form id="form-ruh" class="form form-horizontal">

							<div class="row">
								<div class="col-md-6">
									<fieldset class="form-group">
										<label for="sawal">Saldo Awal</label>
										<select id="sawal" name="sawal" class="form-control chosen">
											<option value="1">Ya</option>
											<option value="0">Tidak</option>
										</select>
									</fieldset>
									<fieldset class="form-group">
										<label for="id_proyek">Proyek</label>
										<select id="id_proyek" name="id_proyek[]" class="form-control chosen" multiple>
										</select>
									</fieldset>
									<fieldset class="form-group">
										<label for="kdakun">Kode Akun/ COA</label>
										<select class="form-control chosen" id="kdakun" name="kdakun[]" multiple>
										</select>
									</fieldset>
								</div>
								<div class="col-md-6">
									<fieldset class="form-group">
										<label for="tgawal">Periode Dari</label>
										<input type="date" id="tgawal" name="tgawal" class="form-control" maxlength="10">
									</fieldset>
									<fieldset class="form-group">
										<label for="tgakhir">Periode Ke</label>
										<input type="date" id="tgakhir" name="tgakhir" class="form-control" maxlength="10">
									</fieldset>
									<fieldset class="form-group">
										<label for="id_alur">Jenis Kegiatan</label>
										<select class="form-control chosen" id="id_alur" name="id_alur[]" multiple disabled>
										</select>
									</fieldset>
									<fieldset class="form-group">
										<label for="nourut">Nomor Transaksi</label>
										<input type="text" class="form-control" id="nourut" name="nourut" placeholder="Pisahkan dengan koma......" disabled>
									</fieldset>
								</div>
							</div>

						</form>
					</div>
				</div>
				<div class="card-footer d-flex justify-content-end pt-0">
					<button type="button" class="btn-send btn btn-primary" id="excel-all">
						<i class="ft-download m-0 mr-sm-1"></i>
						<span class="d-sm-inline-block d-none">Excel</span>
					</button>
				</div>
			</div>
		</div>
	</div>
</section>

<script>
	jQuery(document).ready(function(){
	
		//aktivasi chosen
		jQuery('.chosen').select2({search_contains: true});
		
		jQuery.get('dropdown/akun/html/all1', function(result){
			jQuery('#kdakun').html(result).trigger('change');
		});
		
		jQuery.get('dropdown/proyek', function(result){
			jQuery('#id_proyek').html(result).trigger('change');
		});
		
		jQuery.get('dropdown/alur', function(result){
			jQuery('#id_alur').html(result).trigger('change');
		});
		
		jQuery('#sawal').on('select2:select', function(){
			if(jQuery(this).val()=='1'){
				jQuery('#nourut').val('').prop('disabled', true);
				jQuery('#id_alur').val('').prop('disabled', true).trigger('change');
			}
			else{
				jQuery('#nourut').prop('disabled', false);
				jQuery('#id_alur').val('').prop('disabled', false).trigger('change');
			}
		});
		
		jQuery('#excel-all').click(function(){
			var data = jQuery('#form-ruh').serialize();
			window.open('gl/excel-baru?'+data, '_blank');
		});
		
	});
</script>
